name: CloudOS Native Windows CI

on:
  push:
    branches:
      - main
      - 'rewrite/cloudos-native-win32*'
  pull_request:
    paths:
      - 'desktop/CloudOS.NativeRuntime/**'
      - 'desktop/CloudOS.NativeShell/**'
      - 'scripts/native/**'
      - '*.cmd'
      - 'README.md'
      - 'SECURITY.md'
      - 'docs/native/**'
      - '.github/workflows/cloudos-native-windows.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-native:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Enforce native-only source boundary
        shell: pwsh
        run: |
          $allowedDesktop = @('CloudOS.NativeRuntime', 'CloudOS.NativeShell')
          $unexpectedDesktop = Get-ChildItem -LiteralPath 'desktop' -Directory | Where-Object { $_.Name -notin $allowedDesktop }
          if ($unexpectedDesktop) {
            throw "Unexpected desktop project(s): $($unexpectedDesktop.Name -join ', ')"
          }

          foreach ($legacy in @('frontend', 'backend', 'node_modules', 'package.json', 'package-lock.json')) {
            if (Test-Path -LiteralPath $legacy) {
              throw "Legacy web/runtime path is forbidden in native branch: $legacy"
            }
          }

          $forbiddenExtensions = @('.js', '.jsx', '.ts', '.tsx', '.mjs', '.cjs', '.html', '.css', '.cs', '.csproj', '.xaml')
          $forbiddenSources = Get-ChildItem -Recurse -File | Where-Object {
            $_.FullName -notmatch '[\\/]\.git[\\/]' -and $_.Extension.ToLowerInvariant() -in $forbiddenExtensions
          }
          if ($forbiddenSources) {
            throw "Forbidden legacy source files remain: $($forbiddenSources.FullName -join '; ')"
          }

          $launcher = Get-Content -LiteralPath 'Iniciar CloudOS.cmd' -Raw
          $nativeLauncher = Get-Content -LiteralPath 'scripts/native/build-and-run-cloudos-native.cmd' -Raw
          foreach ($token in @('node ', 'npm ', 'vite', 'webview2', 'start-cloudos.ps1')) {
            if ($launcher.ToLowerInvariant().Contains($token) -or $nativeLauncher.ToLowerInvariant().Contains($token)) {
              throw "Boot path contains forbidden runtime token: $token"
            }
          }
          if (-not $nativeLauncher.Contains('CloudOS.exe')) {
            throw 'Native launcher does not target CloudOS.exe.'
          }

      - name: Build native runtime
        shell: pwsh
        run: msbuild 'desktop/CloudOS.NativeRuntime/CloudOS.NativeRuntime.vcxproj' /m /nologo /v:minimal /p:Configuration=Release /p:Platform=x64

      - name: Build CloudOS.exe
        shell: pwsh
        run: msbuild 'desktop/CloudOS.NativeShell/CloudOS.NativeShell.vcxproj' /m /nologo /v:minimal /p:Configuration=Release /p:Platform=x64

      - name: Verify product binaries
        shell: pwsh
        run: |
          $out = 'desktop/CloudOS.NativeShell/bin/Release'
          $exe = Join-Path $out 'CloudOS.exe'
          $dll = Join-Path $out 'CloudOS.NativeRuntime.dll'
          foreach ($file in @($exe, $dll)) {
            if (-not (Test-Path -LiteralPath $file)) {
              throw "Required product binary missing: $file"
            }
            $item = Get-Item -LiteralPath $file
            if ($item.Length -le 0) {
              throw "Product binary is empty: $file"
            }
            Write-Host "OK $($item.Name) $($item.Length) bytes"
          }

      - name: Build portable package
        shell: pwsh
        run: |
          $package = 'artifacts/CloudOS-Native-x64'
          New-Item -ItemType Directory -Force -Path $package | Out-Null
          Copy-Item 'desktop/CloudOS.NativeShell/bin/Release/CloudOS.exe' $package
          Copy-Item 'desktop/CloudOS.NativeShell/bin/Release/CloudOS.NativeRuntime.dll' $package
          Copy-Item 'README.md' $package
          Copy-Item 'SECURITY.md' $package
          @(
            'CloudOS Native x64',
            "Commit=$env:GITHUB_SHA",
            "BuiltUtc=$([DateTime]::UtcNow.ToString('o'))"
          ) | Set-Content -LiteralPath (Join-Path $package 'BUILD.txt') -Encoding utf8
          Compress-Archive -LiteralPath $package -DestinationPath 'artifacts/CloudOS-Native-x64.zip' -Force
          if (-not (Test-Path -LiteralPath 'artifacts/CloudOS-Native-x64.zip')) {
            throw 'Portable ZIP was not created.'
          }

      - name: Build full source bundle
        shell: pwsh
        run: |
          $bundle = 'artifacts/CloudOS-Native-Source-x64'
          New-Item -ItemType Directory -Force -Path $bundle | Out-Null
          $tracked = git ls-files
          foreach ($path in $tracked) {
            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) { continue }
            $destination = Join-Path $bundle $path
            $parent = Split-Path -Parent $destination
            if ($parent) { New-Item -ItemType Directory -Force -Path $parent | Out-Null }
            Copy-Item -LiteralPath $path -Destination $destination
          }
          $dist = Join-Path $bundle 'dist'
          New-Item -ItemType Directory -Force -Path $dist | Out-Null
          Copy-Item 'desktop/CloudOS.NativeShell/bin/Release/CloudOS.exe' $dist
          Copy-Item 'desktop/CloudOS.NativeShell/bin/Release/CloudOS.NativeRuntime.dll' $dist
          @(
            'CloudOS Native full source + x64 binaries',
            "Commit=$env:GITHUB_SHA",
            "BuiltUtc=$([DateTime]::UtcNow.ToString('o'))"
          ) | Set-Content -LiteralPath (Join-Path $bundle 'BUILD.txt') -Encoding utf8
          Compress-Archive -Path "$bundle/*" -DestinationPath 'artifacts/CloudOS-Native-Source-x64.zip' -Force
          if (-not (Test-Path -LiteralPath 'artifacts/CloudOS-Native-Source-x64.zip')) {
            throw 'Full source ZIP was not created.'
          }

      - name: Upload CloudOS Native x64
        uses: actions/upload-artifact@v4
        with:
          name: CloudOS-Native-x64
          path: artifacts/CloudOS-Native-x64.zip
          if-no-files-found: error
          compression-level: 0

      - name: Upload CloudOS Native source x64
        uses: actions/upload-artifact@v4
        with:
          name: CloudOS-Native-Source-x64
          path: artifacts/CloudOS-Native-Source-x64.zip
          if-no-files-found: error
          compression-level: 0
