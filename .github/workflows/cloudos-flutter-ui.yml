name: CloudOS Flutter UI

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'desktop/CloudOS.FlutterShell/**'
      - 'desktop/CloudOS.SystemBroker/**'
      - 'desktop/CloudOS.BrokerProbe/**'
      - 'scripts/native/**'
      - 'scripts/flutter/**'
      - 'Abrir CloudOS Flutter Preview.cmd'
      - '.github/workflows/cloudos-flutter-ui.yml'

jobs:
  flutter-windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter 3.44.7
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.7'
          channel: stable
          cache: true

      - name: Enable Windows desktop
        shell: pwsh
        run: |
          flutter --version
          flutter config --enable-windows-desktop
          flutter devices

      - name: Build System Broker V21
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vsroot = & $vswhere -latest -products * -requires Microsoft.Component.MSBuild -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          $msbuild = Join-Path $vsroot "MSBuild\Current\Bin\MSBuild.exe"
          & $msbuild "desktop/CloudOS.SystemBroker/CloudOS.SystemBroker.vcxproj" /m /nologo /v:minimal /p:Configuration=Release /p:Platform=x64
          & $msbuild "desktop/CloudOS.BrokerProbe/CloudOS.BrokerProbe.vcxproj" /m /nologo /v:minimal /p:Configuration=Release /p:Platform=x64

      - name: Test System Broker Self-Test & Contract
        shell: pwsh
        run: |
          pwsh -NoProfile -File scripts/native/test-system-broker-v21-contract.ps1
          pwsh -NoProfile -File scripts/native/run-system-broker-smoke-v21.ps1
          pwsh -NoProfile -File scripts/native/test-system-broker-v21-soak.ps1 -DurationSeconds 5
          pwsh -NoProfile -File scripts/native/test-unified-files-v22-contract.ps1
          pwsh -NoProfile -File scripts/native/run-unified-files-v22-smoke.ps1

      - name: Generate local Windows host
        shell: pwsh
        working-directory: desktop/CloudOS.FlutterShell
        run: |
          flutter create --platforms=windows --project-name cloudos_flutter_shell .
          if (Test-Path 'native_bridge') {
            Copy-Item -Path "native_bridge/*" -Destination "windows/runner/" -Force
            $cmakePath = "windows/runner/CMakeLists.txt"
            if (Test-Path $cmakePath) {
              $cmake = Get-Content -Path $cmakePath -Raw
              if ($cmake -notmatch "cloudos_flutter_bridge_v20.cpp") {
                $cmake = $cmake -replace '(\s*"flutter_window\.cpp")', "`$1`n  `"cloudos_flutter_bridge_v20.cpp`"`n  `"cloudos_broker_client_v21.cpp`""
                $cmake = $cmake -replace 'target_link_libraries\(\$\{BINARY_NAME\} PRIVATE flutter flutter_wrapper_app\)', 'target_link_libraries(${BINARY_NAME} PRIVATE flutter flutter_wrapper_app dwmapi.lib shlwapi.lib shell32.lib ole32.lib uuid.lib advapi32.lib)'
                Set-Content -Path $cmakePath -Value $cmake -Encoding UTF8
              }
            }
          }
          if (Test-Path 'test/widget_test.dart') {
            Remove-Item 'test/widget_test.dart' -Force
          }

      - name: Resolve dependencies
        shell: pwsh
        working-directory: desktop/CloudOS.FlutterShell
        run: flutter pub get

      - name: Analyze
        shell: pwsh
        working-directory: desktop/CloudOS.FlutterShell
        run: flutter analyze --fatal-infos --fatal-warnings

      - name: Widget smoke tests
        shell: pwsh
        working-directory: desktop/CloudOS.FlutterShell
        run: flutter test

      - name: Build Windows Release
        shell: pwsh
        working-directory: desktop/CloudOS.FlutterShell
        run: flutter build windows --release

      - name: Stage System Broker binaries in Release
        shell: pwsh
        run: |
          $release = Resolve-Path 'desktop/CloudOS.FlutterShell/build/windows/x64/runner/Release'
          $brokerBin = Resolve-Path 'desktop/CloudOS.NativeShell/bin/Release'
          Copy-Item -Path (Join-Path $brokerBin 'CloudOS.SystemBroker.exe') -Destination $release -Force
          Copy-Item -Path (Join-Path $brokerBin 'CloudOS.BrokerProbe.exe') -Destination $release -Force

      - name: Write V21 evidence
        shell: pwsh
        run: |
          $flutter = (flutter --version | Select-Object -First 1).Trim()
          $release = Resolve-Path 'desktop/CloudOS.FlutterShell/build/windows/x64/runner/Release'
          $exe = Join-Path $release 'cloudos_flutter_shell.exe'
          $brokerExe = Join-Path $release 'CloudOS.SystemBroker.exe'
          if (-not (Test-Path $exe)) { throw "Flutter executable missing: $exe" }
          if (-not (Test-Path $brokerExe)) { throw "SystemBroker executable missing: $brokerExe" }
          $sha = (Get-FileHash $exe -Algorithm SHA256).Hash.ToLowerInvariant()
          $brokerSha = (Get-FileHash $brokerExe -Algorithm SHA256).Hash.ToLowerInvariant()
          $evidence = [ordered]@{
            schema = 21
            verdict = 'pass'
            flutter = $flutter
            git_sha = '${{ github.sha }}'
            presentation_layer = 'Flutter 3.44.7'
            native_bridge_channel = 'cloudos/native/v19'
            native_broker_ipc = 'NamedPipe v21'
            broker_protocol_version = 21
            native_bridge_registered = $true
            get_apps_contract = $true
            system_snapshot_contract = $true
            launch_app_contract = $true
            arbitrary_command_api = $false
            winlogon_modified = $false
            shell_activation_executed = $false
            executable = 'cloudos_flutter_shell.exe'
            executable_sha256 = $sha
            broker_executable = 'CloudOS.SystemBroker.exe'
            broker_executable_sha256 = $brokerSha
          }
          $evidence | ConvertTo-Json -Depth 4 | Set-Content -Encoding UTF8 'flutter-v21-smoke.json'
          Get-Content 'flutter-v21-smoke.json'

      - name: Package Flutter preview
        shell: pwsh
        run: |
          $release = Resolve-Path 'desktop/CloudOS.FlutterShell/build/windows/x64/runner/Release'
          Compress-Archive -Path "$release\*" -DestinationPath 'CloudOS-Flutter-V21-Windows-x64.zip' -Force

      - name: Upload Flutter preview
        uses: actions/upload-artifact@v4
        with:
          name: CloudOS-Flutter-V21-${{ github.sha }}
          path: |
            CloudOS-Flutter-V21-Windows-x64.zip
            flutter-v21-smoke.json
            system-broker-v21-smoke.json
          if-no-files-found: error
          retention-days: 14
