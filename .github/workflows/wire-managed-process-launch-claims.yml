name: Wire Managed Process Launch Claims

on:
  push:
    branches:
      - integration/cloudos-unified-runtime
    paths:
      - .github/workflows/wire-managed-process-launch-claims.yml

permissions:
  contents: write

jobs:
  wire:
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: integration/cloudos-unified-runtime
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Wire Host launch claims and tests
        shell: pwsh
        run: |
          $patch = @'
          from pathlib import Path

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected one match, found {count}')
              return text.replace(old, new, 1)

          bridge_path = Path('desktop/CloudOS.Host/Bridge/WebMessageBridge.cs')
          bridge = bridge_path.read_text(encoding='utf-8')
          bridge = replace_once(
              bridge,
              '''        request.Headers.Authorization = new AuthenticationHeaderValue("Bearer", token);\n        request.Headers.Add("X-CloudOS-Host-Token", _hostLeaseToken);\n        request.Content = new StringContent("{}", Encoding.UTF8, "application/json");\n        using var response = await _http.SendAsync(request);''',
              '''        request.Headers.Authorization = new AuthenticationHeaderValue("Bearer", token);\n        request.Headers.Add("X-CloudOS-Host-Token", _hostLeaseToken);\n        var launchGuardRequestJson = NativeManagedProcessClaims.CreateLaunchGuardRequestJson(\n            _launchLeasesByProcessId.Values.ToArray());\n        request.Content = new StringContent(launchGuardRequestJson, Encoding.UTF8, "application/json");\n        using var response = await _http.SendAsync(request);''',
              'launch-guard-request-body'
          )
          bridge_path.write_text(bridge, encoding='utf-8')

          tests_path = Path('desktop/CloudOS.Host.Tests/Program.cs')
          tests = tests_path.read_text(encoding='utf-8')
          tests = replace_once(
              tests,
              'using System.Diagnostics;\nusing System.Runtime.InteropServices;\n',
              'using System.Diagnostics;\nusing System.Globalization;\nusing System.Runtime.InteropServices;\n',
              'culture-using'
          )
          tests = replace_once(
              tests,
              '    ("native lease identity remains stable after disposal", NativeLeaseIdentitySurvivesDispose),\n',
              '    ("native lease identity remains stable after disposal", NativeLeaseIdentitySurvivesDispose),\n    ("native managed process claims bind PID to creation time", NativeManagedProcessClaimsBindPidAndCreationTime),\n',
              'managed-claim-test-list'
          )

          method = r'''static void NativeManagedProcessClaimsBindPidAndCreationTime()
          {
              var processPath = Environment.ProcessPath ?? throw new InvalidOperationException("The test process path is unavailable.");
              var spec = NativeProcessLaunchSpec.Create(
                  processPath,
                  FixtureArguments("--native-contained-fixture-wait"),
                  AppContext.BaseDirectory);
              using var lease = NativeContainedProcessLauncher.StartSuspended(spec);
              lease.Resume();

              var expectedStart = lease.Process.StartTime
                  .ToUniversalTime()
                  .ToFileTimeUtc()
                  .ToString(CultureInfo.InvariantCulture);
              var claims = NativeManagedProcessClaims.Capture([lease]);
              var claim = claims.SingleOrDefault(item => item.ProcessId == lease.ProcessId);
              Assert(claim is not null, "The active contained root PID must be exported to the launch guard.");
              Assert(claim!.StartTimeFileTimeUtc == expectedStart,
                  "A managed process claim must bind PID to the exact Windows process creation time.");

              var json = NativeManagedProcessClaims.CreateLaunchGuardRequestJson([lease]);
              using var document = JsonDocument.Parse(json);
              var managed = document.RootElement.GetProperty("managedProcesses");
              Assert(managed.ValueKind == JsonValueKind.Array && managed.GetArrayLength() >= 1,
                  "The Host launch request must contain a managedProcesses array.");
              var serializedClaim = managed.EnumerateArray()
                  .FirstOrDefault(item => item.GetProperty("processId").GetInt32() == lease.ProcessId);
              Assert(serializedClaim.ValueKind == JsonValueKind.Object,
                  "The launch request must serialize the active contained process claim.");
              Assert(serializedClaim.GetProperty("startTimeFileTimeUtc").GetString() == expectedStart,
                  "FILETIME must stay a decimal string across the Host-to-backend JSON boundary.");

              Assert(lease.TryTerminate(3_000, out var terminationError),
                  terminationError ?? "The managed-claim fixture Job did not terminate.");
          }

          '''.replace('          ', '')
          tests = replace_once(
              tests,
              'static void NativeJobChildWindowIsQuarantined()\n',
              method + 'static void NativeJobChildWindowIsQuarantined()\n',
              'managed-claim-test-method'
          )
          tests_path.write_text(tests, encoding='utf-8')
          '@
          Set-Content -LiteralPath wire-managed-claims.py -Value $patch -Encoding utf8
          python wire-managed-claims.py
          Remove-Item -LiteralPath wire-managed-claims.py -Force

      - name: Run backend guard contracts
        shell: pwsh
        run: node --test backend/test/windows-external-instance-guard.test.js

      - name: Run Host contracts
        shell: pwsh
        run: dotnet run --project desktop/CloudOS.Host.Tests/CloudOS.Host.Tests.csproj -c Release

      - name: Verify bounded diff
        shell: pwsh
        run: |
          $changed = @(git status --porcelain | ForEach-Object { $_.Substring(3) })
          $expected = @(
            'desktop/CloudOS.Host/Bridge/WebMessageBridge.cs',
            'desktop/CloudOS.Host.Tests/Program.cs'
          )
          if ($changed.Count -ne $expected.Count) { throw "UNEXPECTED_CHANGED_FILE_COUNT=$($changed.Count)" }
          foreach ($path in $expected) {
            if ($changed -notcontains $path) { throw "EXPECTED_FILE_NOT_CHANGED=$path" }
          }

      - name: Commit wiring
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- desktop/CloudOS.Host/Bridge/WebMessageBridge.cs desktop/CloudOS.Host.Tests/Program.cs
          git commit -m "fix(host): identify contained processes in launch guard"
          git push origin HEAD:integration/cloudos-unified-runtime
