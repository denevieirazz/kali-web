name: CloudOS Terminal Core CI

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'desktop/CloudOS.FlutterShell/native_bridge/cloudos_conpty_manager.*'
      - 'desktop/CloudOS.FlutterShell/native_bridge/cloudos_flutter_bridge_v20.*'
      - 'scripts/flutter/test-conpty-stability-v22-contract.ps1'
      - 'scripts/native/test-flutter-broker-client-hardening-v22-contract.ps1'
      - '.github/workflows/visible-terminal-wsl-core.yml'

permissions:
  contents: read

jobs:
  terminal-core:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify retired web terminal did not return
        shell: pwsh
        run: |
          foreach ($path in @(
            'frontend/src/apps/CloudOSTerminal',
            'frontend/test/terminalSessionTransport.test.js',
            'frontend/scripts/dev-server.js'
          )) {
            if (Test-Path -LiteralPath $path) {
              throw "Retired web terminal surface returned: $path"
            }
          }
          Write-Host 'PASS: retired web terminal surface is absent.'

      - name: ConPTY bounded-session stability contract
        shell: pwsh
        run: ./scripts/flutter/test-conpty-stability-v22-contract.ps1

      - name: Flutter Broker client hardening contract
        shell: pwsh
        run: ./scripts/native/test-flutter-broker-client-hardening-v22-contract.ps1
