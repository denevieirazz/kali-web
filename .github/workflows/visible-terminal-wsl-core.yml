name: CloudOS Visible Terminal WSL Core

on:
  workflow_dispatch:
  push:
    branches: [feature/cloudos-visible-terminal-wsl-core]
    paths:
      - 'frontend/src/apps/CloudOSTerminal/**'
      - 'frontend/test/*Terminal*'
      - 'frontend/test/terminalSessionTransport.test.js'
      - 'frontend/scripts/dev-server.js'
      - 'frontend/vite.config.ts'
      - 'backend/test/visible-terminal-websocket-contract.test.js'
      - 'scripts/*visible-terminal*wsl-core*'
      - 'docs/VISIBLE_TERMINAL_WSL_CORE.md'
      - '.github/workflows/visible-terminal-wsl-core.yml'
  pull_request:
    paths:
      - 'frontend/src/apps/CloudOSTerminal/**'
      - 'frontend/test/*Terminal*'
      - 'frontend/test/terminalSessionTransport.test.js'
      - 'frontend/scripts/dev-server.js'
      - 'frontend/vite.config.ts'
      - 'backend/test/visible-terminal-websocket-contract.test.js'
      - 'scripts/*visible-terminal*wsl-core*'
      - 'docs/VISIBLE_TERMINAL_WSL_CORE.md'
      - '.github/workflows/visible-terminal-wsl-core.yml'

jobs:
  visible-terminal:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: npm
      - name: Install workspace dependencies
        run: npm ci
      - name: Frontend lifecycle tests
        run: npm --prefix frontend test
      - name: Frontend TypeScript contract
        run: npm --prefix frontend run lint
      - name: Frontend production build
        run: npm --prefix frontend run build
      - name: Existing secure adapter regression
        run: node --test backend/test/wsl-core-terminal.test.js
      - name: Visible Terminal backend WebSocket contract
        run: node --test backend/test/visible-terminal-websocket-contract.test.js
      - name: Parse visible physical probe
        run: node --check scripts/probe-visible-terminal-wsl-core.mjs
      - name: Parse PowerShell launchers
        shell: pwsh
        run: |
          foreach ($file in @('./scripts/visible-terminal-wsl-core-common.ps1','./scripts/start-cloudos-visible-terminal-v2.ps1','./scripts/validate-visible-terminal-wsl-core.ps1','./scripts/test-visible-terminal-wsl-core-contract.ps1')) {
            $tokens=$null; $errors=$null
            [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $file),[ref]$tokens,[ref]$errors)
            if($errors.Count){$errors|ForEach-Object{Write-Error "$file : $($_.Message)"};exit 1}
          }
      - name: Safety and integration contract
        shell: pwsh
        run: ./scripts/test-visible-terminal-wsl-core-contract.ps1
      - name: Diff whitespace
        shell: pwsh
        run: git diff --check 7424eb7c8775bb534f05ff0c7efedbc55a50e551...HEAD
