name: Windows Captured Surface Presenter CI

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'desktop/CloudOS.WindowsCapture/**'
      - 'desktop/CloudOS.WindowsCapture.Presenter/**'
      - 'desktop/CloudOS.WindowsCapture.Presenter.Probe/**'
      - 'desktop/CloudOS.WindowsCapture.Contracts.Tests/**'
      - 'desktop/CloudOS.WindowsCapture.Input.Tests/**'
      - '.github/workflows/windows-captured-surface-presenter-ci.yml'

jobs:
  validate-presenter-stack:
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build native presenter
        run: dotnet build desktop/CloudOS.WindowsCapture.Presenter/CloudOS.WindowsCapture.Presenter.csproj -c Release --nologo

      - name: Build end-to-end presenter probe
        run: dotnet build desktop/CloudOS.WindowsCapture.Presenter.Probe/CloudOS.WindowsCapture.Presenter.Probe.csproj -c Release --nologo

      - name: Validate presenter probe CLI
        shell: pwsh
        run: |
          $probe = 'desktop/CloudOS.WindowsCapture.Presenter.Probe/bin/Release/net8.0-windows10.0.19041.0/CloudOS.WindowsCapture.Presenter.Probe.dll'
          $output = dotnet $probe --help 2>&1 | Out-String
          if ($LASTEXITCODE -ne 0) { throw "Presenter probe --help failed: $LASTEXITCODE`n$output" }
          foreach ($required in @('--hwnd <decimal|0xHEX>', '--minimum-frames <1-600>', '--output <path>')) {
            if (-not $output.Contains($required, [System.StringComparison]::Ordinal)) {
              throw "Presenter probe CLI missing '$required'.`n$output"
            }
          }
          Write-Host $output

      - name: Run presentation contracts
        run: dotnet run --project desktop/CloudOS.WindowsCapture.Contracts.Tests/CloudOS.WindowsCapture.Contracts.Tests.csproj -c Release

      - name: Run input contracts
        run: dotnet run --project desktop/CloudOS.WindowsCapture.Input.Tests/CloudOS.WindowsCapture.Input.Tests.csproj -c Release
