name: TEMP Fix CI contract and whitespace

on:
  push:
    branches:
      - poc/cloudos-linux-runtime-xpra

permissions:
  contents: write

jobs:
  fix:
    runs-on: windows-2025
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: poc/cloudos-linux-runtime-xpra
          fetch-depth: 0
      - name: Apply reproduced CI fixes
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          # Preserve the secure Terminal contract after bootstrap argv moved into
          # wslTerminalContainment.js. Crypto/session checks remain on the adapter;
          # WSL argv checks follow the module that now owns the bootstrap argv.
          $contractPath = 'scripts/test-wsl-core-secure-terminal-contract.ps1'
          $text = Get-Content -LiteralPath $contractPath -Raw
          $text = $text.Replace(
            "$terminalAdapter = Join-Path $root 'backend\src\terminal\wslCoreAdapter.js'`n$terminalSocket = Join-Path $root 'backend\src\terminal\websocket.js'",
            "$terminalAdapter = Join-Path $root 'backend\src\terminal\wslCoreAdapter.js'`n$terminalContainment = Join-Path $root 'backend\src\terminal\wslTerminalContainment.js'`n$terminalSocket = Join-Path $root 'backend\src\terminal\websocket.js'"
          )
          $text = $text.Replace(
            'foreach ($path in @($coreRoot,$hostRoot,$terminalAdapter,$terminalSocket,$validationScript,$nodeProbe)) {',
            'foreach ($path in @($coreRoot,$hostRoot,$terminalAdapter,$terminalContainment,$terminalSocket,$validationScript,$nodeProbe)) {'
          )
          $old = @'
$adapterText = Get-Content -LiteralPath $terminalAdapter -Raw
foreach ($required in @('createCipheriv','createDecipheriv','aes-256-gcm','FRAME_SEQUENCE','FRAME_INTEGRITY','CLOUDOS_WSL_CORE_TERMINAL','CLOUDOS_WSL_CORE_TERMINAL_FALLBACK','terminal.create','--distribution','--exec')) {
  Require ($adapterText.IndexOf($required, [StringComparison]::Ordinal) -ge 0) "Node WSL core adapter is missing contract token: $required"
}
Require ($adapterText -match 'shell:\s*false') 'Node WSL bootstrap does not explicitly disable shell execution.'
'@
          $new = @'
$adapterText = Get-Content -LiteralPath $terminalAdapter -Raw
$containmentText = Get-Content -LiteralPath $terminalContainment -Raw
foreach ($required in @('createCipheriv','createDecipheriv','aes-256-gcm','FRAME_SEQUENCE','FRAME_INTEGRITY','CLOUDOS_WSL_CORE_TERMINAL','CLOUDOS_WSL_CORE_TERMINAL_FALLBACK','terminal.create','buildContainedCoreBootstrapArgs')) {
  Require ($adapterText.IndexOf($required, [StringComparison]::Ordinal) -ge 0) "Node WSL core adapter is missing contract token: $required"
}
foreach ($required in @('--distribution','--user','root','--exec','/usr/bin/env','mount-pid-nointerop-v1')) {
  Require ($containmentText.IndexOf($required, [StringComparison]::Ordinal) -ge 0) "Terminal containment bootstrap is missing contract token: $required"
}
Require ($adapterText -match 'shell:\s*false') 'Node WSL bootstrap does not explicitly disable shell execution.'
'@
          if (-not $text.Contains($old)) { throw 'Secure Terminal contract block did not match expected SHA state.' }
          $text = $text.Replace($old, $new)
          $text = $text.Replace(
            '$implementationText = @($protocolGo,$protocolCs,$processText,$serverText,$adapterText) -join "`n"',
            '$implementationText = @($protocolGo,$protocolCs,$processText,$serverText,$adapterText,$containmentText) -join "`n"'
          )
          $text = $text.Replace(
            "@($supervisorText,'Supervisor'),@($adapterText,'Node adapter'),@($validationText,'Physical validator')",
            "@($supervisorText,'Supervisor'),@($adapterText,'Node adapter'),@($containmentText,'Terminal containment'),@($validationText,'Physical validator')"
          )
          Set-Content -LiteralPath $contractPath -Value ($text.TrimEnd("`r","`n") + "`n") -NoNewline

          # Remove only the whitespace defects reproduced by git diff --check.
          $paths = @(
            'backend/test/linux-desktop-scanner.test.js',
            'frontend/src/services/unifiedAppCatalog.d.ts',
            'scripts/validate-user-real-journey.mjs'
          )
          foreach ($path in $paths) {
            $raw = Get-Content -LiteralPath $path -Raw
            $normalized = [regex]::Replace($raw, '[ \t]+(?=\r?$)', '', [Text.RegularExpressions.RegexOptions]::Multiline)
            $normalized = $normalized.TrimEnd("`r","`n") + "`n"
            Set-Content -LiteralPath $path -Value $normalized -NoNewline
          }

          ./scripts/test-wsl-core-secure-terminal-contract.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --test backend/test/wsl-core-terminal.test.js backend/test/linux-desktop-scanner.test.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/test-wsl-core-secure-terminal-contract.ps1 backend/test/linux-desktop-scanner.test.js frontend/src/services/unifiedAppCatalog.d.ts scripts/validate-user-real-journey.mjs
          git commit -m 'fix(ci): align WSL containment contract and whitespace'
          git push origin HEAD:poc/cloudos-linux-runtime-xpra
