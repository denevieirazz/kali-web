name: Refresh Visual Baselines On Windows Runner

on:
  push:
    branches:
      - poc/cloudos-linux-runtime-xpra

permissions:
  contents: write

jobs:
  refresh-snapshots:
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: poc/cloudos-linux-runtime-xpra
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install chromium

      - name: Build frontend
        run: npm.cmd run build

      - name: Run Playwright update snapshots
        shell: pwsh
        run: |
          npx playwright test tests/playwright/boot-oobe.spec.ts tests/playwright/onboarding-responsive.spec.ts tests/playwright/settings-personalization.spec.ts tests/playwright/start-menu.spec.ts tests/playwright/window-lifecycle.spec.ts --update-snapshots --reporter=list

      - name: Commit and push updated snapshots
        shell: pwsh
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add tests/playwright/__screenshots__/
          $hasChanges = git status -s
          if ($hasChanges) {
            git commit -m "test(playwright): align reviewed visual baselines directly from windows-2022 runner"
            git push origin poc/cloudos-linux-runtime-xpra
          } else {
            Write-Host "No visual baseline changes."
          }
