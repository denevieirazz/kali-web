name: Refresh audited Playwright baselines once

on:
  push:
    branches:
      - stabilization/cloudos-foundation-batch-1

permissions:
  actions: read
  contents: write

jobs:
  refresh-audited-baselines:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact branch state
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download audited Windows artifact
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/9266682457/zip" \
            -o "$RUNNER_TEMP/audited-playwright.zip"
          mkdir -p "$RUNNER_TEMP/audited-playwright"
          unzip -q "$RUNNER_TEMP/audited-playwright.zip" -d "$RUNNER_TEMP/audited-playwright"

      - name: Verify provenance and install audited baselines
        shell: python
        run: |
          import hashlib
          import json
          import os
          import shutil
          from pathlib import Path

          artifact = Path(os.environ['RUNNER_TEMP']) / 'audited-playwright'
          manifest = json.loads((artifact / 'manifest.json').read_text(encoding='utf-8-sig'))
          expected_head = '2a2d7fea28952342c7fcefdddd3111ac253806be'
          expected_run = '31958635637'
          if manifest.get('head') != expected_head or str(manifest.get('runId')) != expected_run:
              raise SystemExit(f'Unexpected artifact provenance: {manifest!r}')

          replacements = {
              'oobe-welcome-actual.png': (
                  '72ea86ba833cd01bc0ab70e0d6d3cc3d79d646bbd78df30398e0948c23ef3001',
                  Path('tests/playwright/__screenshots__/boot-oobe.spec.ts/oobe-welcome-chromium-windows.png'),
              ),
              'start-menu-all-actual.png': (
                  '48c702fcfe95896dc62bc489391de3e6920db88dacabcc685c1a10fe90d0874e',
                  Path('tests/playwright/__screenshots__/start-menu.spec.ts/start-menu-all-chromium-windows.png'),
              ),
          }

          for filename, (expected_sha, destination) in replacements.items():
              matches = list(artifact.rglob(filename))
              if len(matches) != 1:
                  raise SystemExit(f'Expected exactly one {filename}, found {len(matches)}')
              source = matches[0]
              actual_sha = hashlib.sha256(source.read_bytes()).hexdigest()
              if actual_sha != expected_sha:
                  raise SystemExit(f'Hash mismatch for {filename}: {actual_sha}')
              destination.parent.mkdir(parents=True, exist_ok=True)
              shutil.copyfile(source, destination)
              print(f'Installed {filename} -> {destination} ({actual_sha})')

      - name: Commit only audited PNG baselines
        shell: bash
        run: |
          set -euo pipefail
          git add -- \
            tests/playwright/__screenshots__/boot-oobe.spec.ts/oobe-welcome-chromium-windows.png \
            tests/playwright/__screenshots__/start-menu.spec.ts/start-menu-all-chromium-windows.png
          if git diff --cached --quiet; then
            echo "Audited baselines already installed; no commit required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "test(playwright): atualizar baselines visuais auditados"
          git push origin HEAD:stabilization/cloudos-foundation-batch-1
