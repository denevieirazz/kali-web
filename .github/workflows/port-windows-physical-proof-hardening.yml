name: Port Windows Physical Proof Hardening

on:
  push:
    branches:
      - integration/cloudos-unified-runtime
    paths:
      - .github/workflows/port-windows-physical-proof-hardening.yml

permissions:
  contents: write

jobs:
  port:
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: integration/cloudos-unified-runtime
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x

      - name: Port reviewed proof fixes
        shell: pwsh
        run: |
          git cherry-pick --no-commit 658d4de2a087652a7946508428d0e42b42ff5a5c
          if ($LASTEXITCODE -ne 0) { throw 'PROOF_HOST_DISCOVERY_PORT_FAILED' }
          git cherry-pick --no-commit 89a4ac7ecd5ae19b44de36600db1b41584e66c1c
          if ($LASTEXITCODE -ne 0) { throw 'ABSENT_EVIDENCE_PORT_FAILED' }
          git cherry-pick --no-commit ad9639f1ce8d808d2d532404fd9ca6673244052e
          if ($LASTEXITCODE -ne 0) { throw 'PROOF_CONTRACT_PORT_FAILED' }

      - name: Run proof contracts
        shell: pwsh
        run: node --test backend/test/windows-physical-proof-contract.test.js

      - name: Parse PowerShell proof scripts
        shell: pwsh
        run: |
          $scripts = @(
            'scripts/run-windows-contained-runtime-physical-proof.ps1',
            'scripts/collect-windows-native-containment-evidence.ps1'
          )
          foreach ($script in $scripts) {
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $script), [ref]$tokens, [ref]$errors)
            if ($errors.Count -gt 0) { throw "$script parse errors: $($errors -join '; ')" }
          }

      - name: Verify bounded diff
        shell: pwsh
        run: |
          $changed = @(git status --porcelain | ForEach-Object { $_.Substring(3) })
          $expected = @(
            'backend/test/windows-physical-proof-contract.test.js',
            'scripts/collect-windows-native-containment-evidence.ps1',
            'scripts/run-windows-contained-runtime-physical-proof.ps1'
          )
          if ($changed.Count -ne $expected.Count) { throw "UNEXPECTED_CHANGED_FILE_COUNT=$($changed.Count)" }
          foreach ($path in $expected) {
            if ($changed -notcontains $path) { throw "EXPECTED_FILE_NOT_CHANGED=$path" }
          }

      - name: Commit port
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- backend/test/windows-physical-proof-contract.test.js scripts/collect-windows-native-containment-evidence.ps1 scripts/run-windows-contained-runtime-physical-proof.ps1
          git commit -m "fix(test): harden Windows physical proof harness"
          git push origin HEAD:integration/cloudos-unified-runtime
