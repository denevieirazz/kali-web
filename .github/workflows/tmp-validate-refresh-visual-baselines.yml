name: TEMP Validate Remaining Visual Baselines

on:
  pull_request:
    paths:
      - .github/workflows/tmp-validate-refresh-visual-baselines.yml

permissions:
  contents: write

concurrency:
  group: temp-visual-baseline-refresh-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate-and-refresh:
    runs-on: windows-2022
    timeout-minutes: 25
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: poc/cloudos-linux-runtime-xpra
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install chromium

      - name: Build frontend
        run: npm.cmd run build

      - name: Validate semantics and refresh only reviewed baselines
        shell: pwsh
        run: |
          $approved = @(
            'tests/playwright/__screenshots__/settings-personalization.spec.ts/settings-personalization-chromium-windows.png',
            'tests/playwright/__screenshots__/settings-personalization.spec.ts/settings-taskbar-top-chromium-windows.png',
            'tests/playwright/__screenshots__/settings-personalization.spec.ts/desktop-custom-wallpaper-chromium-windows.png',
            'tests/playwright/__screenshots__/start-menu.spec.ts/start-menu-all-chromium-windows.png',
            'tests/playwright/__screenshots__/window-lifecycle.spec.ts/start-running-calculator-chromium-windows.png'
          )

          npx playwright test tests/playwright/settings-personalization.spec.ts tests/playwright/start-menu.spec.ts tests/playwright/window-lifecycle.spec.ts --update-snapshots --reporter=list
          $testExit = $LASTEXITCODE
          if ($testExit -ne 0) {
            Write-Error "Semantic Playwright validation failed with exit code $testExit; refusing to update baselines."
            exit $testExit
          }

          $changed = @(git diff --name-only -- tests/playwright/__screenshots__)
          Write-Host 'Changed screenshot files:'
          $changed | ForEach-Object { Write-Host "  $_" }

          $unexpected = @($changed | Where-Object { $_ -notin $approved })
          if ($unexpected.Count -gt 0) {
            Write-Error "Unexpected screenshot changes: $($unexpected -join ', ')"
            exit 2
          }

          $missing = @($approved | Where-Object { $_ -notin $changed })
          if ($missing.Count -gt 0) {
            Write-Error "Expected reviewed screenshots did not change: $($missing -join ', ')"
            exit 3
          }

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- $approved
          git commit -m 'test(playwright): align reviewed visual baselines'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git push origin HEAD:poc/cloudos-linux-runtime-xpra
          exit $LASTEXITCODE
