name: CloudOS Workflow Batch 3 CI

on:
  push:
    branches:
      - feature/cloudos-workflow-batch-3
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudos-workflow-batch3-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux-workflow:
    name: Linux workflow regression
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout Batch 3
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
      - name: Verify frozen scope
        run: node scripts/workflow/test-batch3-scope.mjs
      - name: Install dependencies
        run: npm ci
      - name: Frontend tests
        run: npm run test:frontend
      - name: Backend regression
        run: npm test
      - name: E2E regression
        run: npm run test:e2e
      - name: Lint
        run: npm run lint
      - name: Production build
        run: npm run build

  windows-workflow:
    name: Windows workflow regression
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout Batch 3
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
      - name: Verify frozen scope
        run: node scripts/workflow/test-batch3-scope.mjs
      - name: Install dependencies
        run: npm ci
      - name: Frontend tests
        run: npm run test:frontend
      - name: Backend regression
        run: npm test
      - name: E2E regression
        run: npm run test:e2e
      - name: Lint
        run: npm run lint
      - name: Production build
        run: npm run build
