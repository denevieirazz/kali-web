name: Apply Native Windows Surface Default

on:
  push:
    branches:
      - integration/cloudos-unified-runtime
    paths:
      - scripts/native/apply-native-surface-default.ps1

permissions:
  contents: write

jobs:
  apply:
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: integration/cloudos-unified-runtime
          fetch-depth: 0

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Apply native surface default
        shell: pwsh
        run: ./scripts/native/apply-native-surface-default.ps1

      - name: Check patch whitespace
        shell: pwsh
        run: git diff --check

      - name: Build CloudOS Host
        shell: pwsh
        run: dotnet build desktop/CloudOS.Host/CloudOS.Host.csproj -c Release --nologo

      - name: Run Host contracts
        shell: pwsh
        run: dotnet run --project desktop/CloudOS.Host.Tests/CloudOS.Host.Tests.csproj -c Release

      - name: Commit validated native surface default
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add desktop/CloudOS.Host/Bridge/WebMessageBridge.cs
          if (git diff --cached --quiet) {
            Write-Host 'No bridge change required.'
            exit 0
          }
          git commit -m "feat: prefer real native Windows surfaces"
          git push origin HEAD:integration/cloudos-unified-runtime
