name: CloudOS CI Baseline

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  validate-current-product-boundary:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify legacy React desktop is retired
        shell: pwsh
        run: |
          $forbidden = @(
            'frontend/src',
            'frontend/public',
            'frontend/scripts',
            'frontend/test',
            'frontend/index.html',
            'frontend/server.js',
            'frontend/vite.config.ts',
            'frontend/eslint.config.js',
            'frontend/tsconfig.json',
            'frontend/tsconfig.app.json',
            'frontend/tsconfig.node.json'
          )
          foreach ($path in $forbidden) {
            if (Test-Path -LiteralPath $path) {
              throw "Retired React desktop surface returned: $path"
            }
          }

          foreach ($path in @(
            'frontend/README.md',
            'desktop/CloudOS.FlutterShell/pubspec.yaml',
            'desktop/CloudOS.FlutterShell/lib',
            'desktop/CloudOS.NativeShell',
            'desktop/CloudOS.NativeRuntime',
            'desktop/CloudOS.NativeRecovery',
            'desktop/CloudOS.SystemBroker'
          )) {
            if (-not (Test-Path -LiteralPath $path)) {
              throw "Current CloudOS source boundary missing: $path"
            }
          }

          $retired = Get-Content -LiteralPath 'frontend/README.md' -Raw
          if (-not $retired.Contains('Legacy React desktop — retired')) {
            throw 'frontend/README.md must remain an explicit retirement tombstone.'
          }

          Write-Host 'PASS: legacy React desktop is retired; Flutter presentation + native authorities remain.'

      - name: Validate PowerShell 7 runtime requirement
        shell: pwsh
        run: ./scripts/test-powershell7-requirement.ps1

      - name: Repository clarity contract
        shell: pwsh
        run: ./scripts/native/test-repository-clarity-v15-contract.ps1

      - name: Flutter managed Win32 containment contract
        shell: pwsh
        run: ./scripts/flutter/test-managed-win32-containment-v22-contract.ps1

      - name: Flutter ConPTY stability contract
        shell: pwsh
        run: ./scripts/flutter/test-conpty-stability-v22-contract.ps1
