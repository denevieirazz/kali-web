name: Windows Captured Surface CI

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'desktop/CloudOS.WindowsCapture/**'
      - 'desktop/CloudOS.WindowsCapture.Probe/**'
      - 'desktop/CloudOS.WindowsCapture.Fixture/**'
      - 'scripts/test-windows-capture-probe.ps1'
      - 'README.md'
      - 'docs/NATIVE-HOST-ROADMAP.md'
      - '.github/workflows/windows-captured-surface-ci.yml'

jobs:
  build-capture-probe:
    runs-on: windows-2022
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build generic Windows capture probe
        run: dotnet build desktop/CloudOS.WindowsCapture.Probe/CloudOS.WindowsCapture.Probe.csproj -c Release --nologo

      - name: Validate capture probe CLI contract
        shell: pwsh
        run: |
          $probe = 'desktop/CloudOS.WindowsCapture.Probe/bin/Release/net8.0-windows10.0.19041.0/CloudOS.WindowsCapture.Probe.dll'
          $output = dotnet $probe --help 2>&1 | Out-String
          if ($LASTEXITCODE -ne 0) { throw "Unexpected --help exit code: $LASTEXITCODE`n$output" }
          foreach ($required in @('--capture-kind window|monitor', '--item-factory raw|projected', '--output <path>')) {
            if (-not $output.Contains($required, [System.StringComparison]::Ordinal)) {
              throw "Probe help is missing contract '$required'.`n$output"
            }
          }
          Write-Host $output

      - name: Parse physical matrix script
        shell: pwsh
        run: |
          $scriptPath = (Resolve-Path 'scripts/test-windows-capture-probe.ps1').Path
          $tokens = $null
          $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile($scriptPath, [ref]$tokens, [ref]$errors)
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_.Message }
            throw "PowerShell parser found $($errors.Count) error(s)."
          }
          Write-Host 'Physical matrix script parse: PASS'

      - name: Build conventional Windows capture fixture
        run: dotnet build desktop/CloudOS.WindowsCapture.Fixture/CloudOS.WindowsCapture.Fixture.csproj -c Release --nologo
