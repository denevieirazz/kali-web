name: CloudOS WSL Core Foundation

on:
  workflow_dispatch:
  push:
    branches:
      - feature/cloudos-wsl-core-foundation
    paths:
      - 'core/wsl/cloudos-core/**'
      - 'desktop/CloudOS.WslCore/**'
      - 'desktop/CloudOS.WslCore.Probe/**'
      - 'desktop/CloudOS.WslCore.Tests/**'
      - 'scripts/*wsl-core-foundation*.ps1'
      - 'docs/WSL_CORE_FOUNDATION.md'
      - 'THIRD_PARTY_NOTICES.md'
      - '.github/workflows/wsl-core-foundation.yml'
  pull_request:
    paths:
      - 'core/wsl/cloudos-core/**'
      - 'desktop/CloudOS.WslCore/**'
      - 'desktop/CloudOS.WslCore.Probe/**'
      - 'desktop/CloudOS.WslCore.Tests/**'
      - 'scripts/*wsl-core-foundation*.ps1'
      - 'docs/WSL_CORE_FOUNDATION.md'
      - 'THIRD_PARTY_NOTICES.md'
      - '.github/workflows/wsl-core-foundation.yml'

jobs:
  linux-core:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: core/wsl/cloudos-core
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache-dependency-path: core/wsl/cloudos-core/go.sum
      - name: Verify module
        run: go mod verify
      - name: Run Linux core tests
        run: go test ./...
      - name: Build cloudos-core
        run: go build -trimpath ./cmd/cloudos-core

  windows-contracts:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Build Windows WSL core client
        run: dotnet build desktop/CloudOS.WslCore/CloudOS.WslCore.csproj -c Release
      - name: Run Windows contract tests
        run: dotnet run --project desktop/CloudOS.WslCore.Tests/CloudOS.WslCore.Tests.csproj -c Release
      - name: Build physical probe without running it
        run: dotnet build desktop/CloudOS.WslCore.Probe/CloudOS.WslCore.Probe.csproj -c Release
      - name: Validate WSL core safety contract
        shell: pwsh
        run: ./scripts/test-wsl-core-foundation-contract.ps1
      - name: Check branch diff whitespace
        shell: pwsh
        run: git diff --check 56f0ca8bc0a59987a43295da1ded277afc40e6e9...HEAD
