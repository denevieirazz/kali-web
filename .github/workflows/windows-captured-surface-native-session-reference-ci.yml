name: Windows Capture Native Session Reference CI

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'desktop/CloudOS.WindowsCapture.NativeSessionReference/**'
      - '.github/workflows/windows-captured-surface-native-session-reference-ci.yml'

jobs:
  build-native-session-reference:
    runs-on: windows-2022
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Build independent native session reference
        shell: pwsh
        run: |
          msbuild desktop/CloudOS.WindowsCapture.NativeSessionReference/CloudOS.WindowsCapture.NativeSessionReference.vcxproj `
            /m `
            /p:Configuration=Release `
            /p:Platform=x64 `
            /verbosity:minimal

      - name: Validate native session reference CLI
        shell: pwsh
        run: |
          $probe = (Resolve-Path 'desktop/CloudOS.WindowsCapture.NativeSessionReference/bin/Release/x64/CloudOS.WindowsCapture.NativeSessionReference.exe').Path
          $output = & $probe --help 2>&1 | Out-String
          if ($LASTEXITCODE -ne 0) { throw "Unexpected --help exit code: $LASTEXITCODE`n$output" }
          foreach ($required in @(
            '--hwnd <decimal|0xHEX>',
            '--seconds <1-30>',
            '--min-frames <1-1000>',
            '--output <path>',
            'CreateForWindow -> D3D11 -> frame pool -> CreateCaptureSession -> StartCapture -> frames'
          )) {
            if (-not $output.Contains($required, [System.StringComparison]::Ordinal)) {
              throw "Native session reference help is missing '$required'.`n$output"
            }
          }
          Write-Host $output

      - name: Validate missing argument contract
        shell: pwsh
        run: |
          $probe = (Resolve-Path 'desktop/CloudOS.WindowsCapture.NativeSessionReference/bin/Release/x64/CloudOS.WindowsCapture.NativeSessionReference.exe').Path
          $process = Start-Process -FilePath $probe -PassThru -Wait -NoNewWindow
          if ($process.ExitCode -ne 64) {
            throw "Expected exit 64 without arguments, got $($process.ExitCode)."
          }

      - name: Validate invalid HWND JSON contract
        shell: pwsh
        run: |
          $probe = (Resolve-Path 'desktop/CloudOS.WindowsCapture.NativeSessionReference/bin/Release/x64/CloudOS.WindowsCapture.NativeSessionReference.exe').Path
          $reportPath = Join-Path $env:RUNNER_TEMP 'native-session-reference-invalid-hwnd.json'
          Remove-Item -LiteralPath $reportPath -Force -ErrorAction SilentlyContinue

          $startInfo = [System.Diagnostics.ProcessStartInfo]::new()
          $startInfo.FileName = $probe
          foreach ($argument in @('--hwnd', '0x1', '--output', $reportPath)) {
            [void]$startInfo.ArgumentList.Add($argument)
          }
          $startInfo.UseShellExecute = $false
          $startInfo.CreateNoWindow = $true
          $startInfo.RedirectStandardOutput = $true
          $startInfo.RedirectStandardError = $true
          $process = [System.Diagnostics.Process]::Start($startInfo)
          try {
            $stdoutTask = $process.StandardOutput.ReadToEndAsync()
            $stderrTask = $process.StandardError.ReadToEndAsync()
            $process.WaitForExit()
            $output = ($stdoutTask.GetAwaiter().GetResult() + $stderrTask.GetAwaiter().GetResult()).TrimEnd()
            Write-Host $output
            if ($process.ExitCode -ne 3) {
              throw "Expected invalid-HWND exit 3, got $($process.ExitCode)."
            }
          }
          finally {
            $process.Dispose()
          }

          if (-not (Test-Path -LiteralPath $reportPath -PathType Leaf)) {
            throw "Native session reference did not write JSON report: $reportPath"
          }
          $report = Get-Content -LiteralPath $reportPath -Raw | ConvertFrom-Json
          if ($report.schemaVersion -ne 1) { throw "Unexpected schema: $($report.schemaVersion)" }
          if ($report.probe -ne 'CloudOS.WindowsCapture.NativeSessionReference') { throw "Unexpected probe: $($report.probe)" }
          if ($report.verdict -ne 'ERROR') { throw "Unexpected verdict: $($report.verdict)" }
          if ($report.stage -ne 'target-validation') { throw "Unexpected stage: $($report.stage)" }
          if ([long]$report.frameCount -ne 0) { throw 'Invalid HWND unexpectedly produced frames.' }
          Write-Host 'Native session reference invalid-HWND contract: PASS'
