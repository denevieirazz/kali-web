name: Close Native Launch Abort Boundary

on:
  push:
    branches:
      - integration/cloudos-unified-runtime
    paths:
      - .github/workflows/port-browser-launch-isolation.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: integration/cloudos-unified-runtime
          fetch-depth: 0

      - name: Setup dotnet
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Apply bounded patch
        shell: pwsh
        run: ./scripts/tmp-close-native-abort-boundary.ps1

      - name: Run Host contracts
        shell: pwsh
        run: dotnet run --project desktop/CloudOS.Host.Tests/CloudOS.Host.Tests.csproj -c Release

      - name: Verify bounded diff
        shell: pwsh
        run: |
          $changed = @(git status --porcelain | ForEach-Object { $_.Substring(3) })
          if ($changed.Count -ne 1) { throw "UNEXPECTED_CHANGED_FILE_COUNT=$($changed.Count)" }
          if ($changed[0] -ne 'desktop/CloudOS.Host/Bridge/WebMessageBridge.cs') { throw "UNEXPECTED_FILE=$($changed[0])" }

      - name: Commit patch
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- desktop/CloudOS.Host/Bridge/WebMessageBridge.cs
          git commit -m "fix(host): centralize native launch abort ownership"
          git push origin HEAD:integration/cloudos-unified-runtime
