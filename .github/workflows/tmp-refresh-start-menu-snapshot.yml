name: TEMP Refresh Start Menu Home Snapshot

on:
  push:
    branches:
      - poc/cloudos-linux-runtime-xpra
    paths:
      - .github/workflows/tmp-refresh-start-menu-snapshot.yml

permissions:
  contents: write

jobs:
  refresh:
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: poc/cloudos-linux-runtime-xpra
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install chromium

      - name: Build frontend
        run: npm.cmd run build

      - name: Refresh only Start Menu Home baseline
        shell: pwsh
        run: |
          $home = 'tests/playwright/__screenshots__/start-menu.spec.ts/start-menu-home-chromium-windows.png'
          $all = 'tests/playwright/__screenshots__/start-menu.spec.ts/start-menu-all-chromium-windows.png'

          npx playwright test tests/playwright/start-menu.spec.ts --update-snapshots --reporter=list
          $testExit = $LASTEXITCODE

          # PW-02 has a second screenshot. It is outside this reviewed change, so never refresh it here.
          git restore --source=HEAD -- $all

          git status --short
          git diff --quiet -- $home
          if ($LASTEXITCODE -eq 0) {
            throw 'Start Menu Home snapshot did not change; refusing an empty baseline refresh.'
          }

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- $home
          git commit -m 'test(playwright): refresh start menu home visual baseline'
          git push origin HEAD:poc/cloudos-linux-runtime-xpra

          Write-Host "PW-02 update-snapshot exit code: $testExit"
          exit $testExit
