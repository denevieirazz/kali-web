name: CloudOS Workflow Drone

on:
  push:
    branches:
      - stabilization/cloudos-workflow-batch-4
  pull_request:
    branches:
      - stabilization/cloudos-workflow-batch-4
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudos-workflow-drone-${{ github.ref }}
  cancel-in-progress: true

jobs:
  workflow-drone:
    name: Workflow defect drone
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout target revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.2

      - name: Verify checked out SHA integrity
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          TELEMETRY_OUTPUT_DIR: test-results/drone
        run: node scripts/workflow/record-sha-telemetry.mjs --gate

      - name: Unit test SHA telemetry gate
        run: |
          node scripts/workflow/test-record-sha-telemetry.mjs
          node scripts/workflow/test-verify-spec-integrity.mjs
          node scripts/workflow/test-workflow-sha-contract.mjs
          node scripts/workflow/test-batch4-stabilization-scope-contract.mjs

      - name: Verify stabilization scope
        run: node scripts/workflow/test-batch4-stabilization-scope.mjs

      - name: Install dependencies
        run: npm ci

      - name: Build CloudOS frontend
        run: npm run build

      - name: Install Chromium
        run: npx playwright install chromium

      - name: Execute Workflow Drone
        id: drone
        continue-on-error: true
        shell: bash
        run: |
          mkdir -p test-results/drone
          export GITHUB_SHA="$(git rev-parse HEAD)"
          npx playwright test --config=playwright.drone.config.ts 2>&1 | tee test-results/drone/playwright.log
          exit ${PIPESTATUS[0]}

      - name: Render DRONE_REPORT.md
        if: always()
        shell: bash
        run: |
          export GITHUB_SHA="$(git rev-parse HEAD)"
          node scripts/workflow/render-drone-report.mjs

      - name: Publish report to job summary
        if: always()
        shell: bash
        run: cat DRONE_REPORT.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Drone evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: workflow-drone-${{ github.event.pull_request.head.sha || github.sha }}
          retention-days: 14
          if-no-files-found: warn
          path: |
            DRONE_REPORT.md
            test-results/drone/**
            test-results/playwright-drone/**
            playwright-drone-report/**

      - name: Drone severity gate
        if: always()
        shell: bash
        run: |
          export GITHUB_SHA="$(git rev-parse HEAD)"
          node scripts/workflow/render-drone-report.mjs --gate
          if [ "${{ steps.drone.outcome }}" != "success" ]; then
            echo "Drone Playwright terminou com outcome=${{ steps.drone.outcome }}"
            exit 1
          fi
