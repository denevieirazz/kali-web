name: Windows Installer Capability CI

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'desktop/CloudOS.Installer/**'
      - 'desktop/CloudOS.Installer.Tests/**'
      - 'desktop/CloudOS.Host/Browser/**'
      - 'desktop/CloudOS.Host/Bridge/WebMessageBridge.cs'
      - 'desktop/CloudOS.Host/Installer/**'
      - 'frontend/src/apps/WindowsInstaller/**'
      - 'frontend/src/core/appRegistry.ts'
      - 'frontend/src/core/fs/apps.ts'
      - 'frontend/src/services/nativeHostBridge.ts'
      - '.github/workflows/windows-installer-ci.yml'

jobs:
  validate-installer-core:
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build installer capability core
        run: dotnet build desktop/CloudOS.Installer/CloudOS.Installer.csproj -c Release --nologo

      - name: Run installer contract tests
        run: dotnet run --project desktop/CloudOS.Installer.Tests/CloudOS.Installer.Tests.csproj -c Release

      - name: Enforce fail-closed elevation boundary
        shell: pwsh
        run: |
          $root = 'desktop/CloudOS.Installer'
          $text = (Get-ChildItem $root -Filter '*.cs' -File | Get-Content -Raw) -join "`n"
          foreach ($forbidden in @('Verb = "runas"', 'Verb="runas"', 'powershell.exe', 'pwsh.exe', 'schtasks.exe')) {
            if ($text.Contains($forbidden, [System.StringComparison]::OrdinalIgnoreCase)) {
              throw "Installer core contains forbidden elevation fallback '$forbidden'."
            }
          }
          foreach ($required in @('WinVerifyTrust', 'SHA256', 'ELEVATION_BROKER_UNAVAILABLE', 'ExpectedSha256')) {
            if (-not $text.Contains($required, [System.StringComparison]::Ordinal)) {
              throw "Installer core is missing required security contract '$required'."
            }
          }
          Write-Host 'Installer elevation boundary: PASS'

      - name: Enforce preparation-only WebView boundary
        shell: pwsh
        run: |
          $hostBridge = Get-Content 'desktop/CloudOS.Host/Bridge/WebMessageBridge.cs' -Raw
          $client = Get-Content 'frontend/src/services/nativeHostBridge.ts' -Raw
          $panel = Get-Content 'frontend/src/apps/WindowsInstaller/WindowsInstaller.tsx' -Raw
          $registry = Get-Content 'frontend/src/core/appRegistry.ts' -Raw
          $apps = Get-Content 'frontend/src/core/fs/apps.ts' -Raw

          foreach ($required in @('installer.artifacts.list', 'installer.prepare')) {
            if (-not $hostBridge.Contains($required, [System.StringComparison]::Ordinal) -or
                -not $client.Contains($required, [System.StringComparison]::Ordinal)) {
              throw "Installer preparation bridge is missing required method '$required'."
            }
          }

          $publicSurface = "$client`n$panel"
          foreach ($forbidden in @(
            'installer.execute',
            'installer.consume',
            'ExecutablePath',
            'executablePath',
            'WorkingDirectory',
            'workingDirectory',
            'LogPath',
            'logPath'
          )) {
            if ($publicSurface.Contains($forbidden, [System.StringComparison]::Ordinal)) {
              throw "Installer WebView surface exposed forbidden execution detail '$forbidden'."
            }
          }

          foreach ($requiredRegistration in @('windows-installer', 'WindowsInstaller/WindowsInstaller', 'windows-installer.obx')) {
            $found = $registry.Contains($requiredRegistration, [System.StringComparison]::Ordinal) -or
                     $apps.Contains($requiredRegistration, [System.StringComparison]::Ordinal)
            if (-not $found) {
              throw "Installer bundled-app registration is missing '$requiredRegistration'."
            }
          }

          Write-Host 'Installer preparation-only WebView boundary: PASS'
