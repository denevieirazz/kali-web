name: Windows Installer Capability CI

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'desktop/CloudOS.Installer/**'
      - 'desktop/CloudOS.Installer.Tests/**'
      - 'desktop/CloudOS.Host/Browser/**'
      - 'desktop/CloudOS.Host/Bridge/WebMessageBridge.cs'
      - 'desktop/CloudOS.Host/Installer/**'
      - 'desktop/CloudOS.Host/Native/NativeContainedProcessLauncher.cs'
      - '.github/workflows/windows-installer-ci.yml'

permissions:
  contents: read

jobs:
  validate-installer-core:
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Verify retired React installer UI did not return
        shell: pwsh
        run: |
          foreach ($path in @(
            'frontend/src/apps/WindowsInstaller',
            'frontend/src/services/nativeHostBridge.ts',
            'frontend/src/core/appRegistry.ts',
            'frontend/src/core/fs/apps.ts'
          )) {
            if (Test-Path -LiteralPath $path) {
              throw "Retired React installer surface returned: $path"
            }
          }
          Write-Host 'PASS: retired React installer UI is absent.'

      - name: Build installer capability core
        run: dotnet build desktop/CloudOS.Installer/CloudOS.Installer.csproj -c Release --nologo

      - name: Run installer contract tests
        run: dotnet run --project desktop/CloudOS.Installer.Tests/CloudOS.Installer.Tests.csproj -c Release

      - name: Enforce fail-closed elevation boundary
        shell: pwsh
        run: |
          $root = 'desktop/CloudOS.Installer'
          $text = (Get-ChildItem $root -Filter '*.cs' -File | Get-Content -Raw) -join "`n"
          foreach ($forbidden in @('Verb = "runas"', 'Verb="runas"', 'powershell.exe', 'pwsh.exe', 'schtasks.exe')) {
            if ($text.Contains($forbidden, [System.StringComparison]::OrdinalIgnoreCase)) {
              throw "Installer core contains forbidden elevation fallback '$forbidden'."
            }
          }
          foreach ($required in @('WinVerifyTrust', 'SHA256', 'ELEVATION_BROKER_UNAVAILABLE', 'ExpectedSha256')) {
            if (-not $text.Contains($required, [System.StringComparison]::Ordinal)) {
              throw "Installer core is missing required security contract '$required'."
            }
          }
          Write-Host 'Installer elevation boundary: PASS'

      - name: Enforce Host-only contained execution transaction
        shell: pwsh
        run: |
          $coordinator = Get-Content 'desktop/CloudOS.Host/Installer/InstallerContainedExecutionCoordinator.cs' -Raw
          $manager = Get-Content 'desktop/CloudOS.Host/Installer/CloudOsInstallerManager.cs' -Raw
          $browser = Get-Content 'desktop/CloudOS.Host/Browser/BrowserManager.cs' -Raw

          foreach ($required in @(
            'NativeContainedProcessLauncher.StartSuspended',
            'installHostTrackingBeforeResume(lease)',
            '_ownership.Register',
            'lease.Resume()',
            'CompleteRootAfterJobEmpty'
          )) {
            if (-not $coordinator.Contains($required, [System.StringComparison]::Ordinal)) {
              throw "Installer contained execution transaction is missing '$required'."
            }
          }

          if (-not $manager.Contains('StartContainedAsync', [System.StringComparison]::Ordinal) -or
              -not $manager.Contains('CompleteContainedRootAfterJobEmpty', [System.StringComparison]::Ordinal)) {
            throw 'Host installer authority is missing contained execution ownership methods.'
          }
          if (-not $browser.Contains('StartContainedInstallerAsync', [System.StringComparison]::Ordinal) -or
              -not $browser.Contains('CompleteContainedInstallerRootAfterJobEmpty', [System.StringComparison]::Ordinal)) {
            throw 'BrowserManager is missing Host-only installer execution authority.'
          }

          Write-Host 'Installer Host-only contained execution transaction: PASS'
