name: CloudOS Native Full-System CI

on:
  push:
    branches:
      - 'rewrite/cloudos-native-full-system'
  pull_request:
    paths:
      - 'frontend/src/**'
      - 'desktop/CloudOS.NativeRuntime/**'
      - 'desktop/CloudOS.NativeShell/**'
      - 'scripts/native/**'
      - 'docs/native/**'
      - '.github/workflows/cloudos-native-full-system.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-foundation:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Confirm full CloudOS tree is preserved
        shell: pwsh
        run: |
          foreach ($path in @('frontend', 'backend', 'desktop/CloudOS.Host', 'desktop/CloudOS.NativeRuntime', 'desktop/CloudOS.NativeShell')) {
            if (-not (Test-Path -LiteralPath $path)) {
              throw "Required migration source/target path missing: $path"
            }
          }

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Validate and build through the developer entrypoint
        shell: cmd
        run: scripts\native\build-cloudos-native.cmd Release

      - name: Verify native binaries and compiled graph
        shell: pwsh
        run: |
          $out = 'desktop/CloudOS.NativeShell/bin/Release'
          foreach ($name in @('CloudOS.exe', 'CloudOS.NativeRuntime.dll')) {
            $path = Join-Path $out $name
            if (-not (Test-Path -LiteralPath $path)) { throw "Missing $path" }
            if ((Get-Item -LiteralPath $path).Length -le 0) { throw "Empty $path" }
          }

          $project = Get-Content -LiteralPath 'desktop/CloudOS.NativeShell/CloudOS.NativeShell.vcxproj' -Raw
          if ($project.Contains('<ClCompile Include="src\native_web_desktop_window.cpp"') -or
              $project.Contains('<ClCompile Include="src\native_webview_host.cpp"')) {
            throw 'Legacy web desktop returned to the compiled native shell graph.'
          }

          $build = Get-Content -LiteralPath 'scripts/native/build-cloudos-native.cmd' -Raw
          foreach ($forbidden in @('node.exe', 'npm.cmd', 'frontend\dist', 'WEB_UI=')) {
            if ($build.Contains($forbidden)) {
              throw "Native developer build regressed to obsolete web desktop asset build: $forbidden"
            }
          }
