name: CloudOS Native Full-System CI

on:
  push:
    branches:
      - 'rewrite/cloudos-native-full-system'
  pull_request:
    paths:
      - 'frontend/src/**'
      - 'desktop/CloudOS.NativeRuntime/**'
      - 'desktop/CloudOS.NativeShell/**'
      - 'scripts/native/**'
      - 'docs/native/**'
      - '.github/workflows/cloudos-native-full-system.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-foundation:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Confirm full CloudOS tree is preserved
        shell: pwsh
        run: |
          foreach ($path in @('frontend', 'backend', 'desktop/CloudOS.Host', 'desktop/CloudOS.NativeRuntime', 'desktop/CloudOS.NativeShell')) {
            if (-not (Test-Path -LiteralPath $path)) {
              throw "Required migration source/target path missing: $path"
            }
          }

      - name: Validate native shell, WebSkin and productivity contracts
        shell: pwsh
        run: |
          ./scripts/native/test-cloudos-native-shell-contracts.ps1
          ./scripts/native/test-native-web-ui-contract.ps1
          ./scripts/native/test-taskbar-productivity-contract.ps1

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Restore native WebView2 SDK for Browser
        shell: pwsh
        run: |
          $packages = Join-Path $PWD 'desktop\CloudOS.NativeShell\packages'
          msbuild 'desktop/CloudOS.NativeShell/CloudOS.NativeShell.vcxproj' /t:Restore /nologo /v:minimal /p:RestorePackagesConfig=true /p:RestoreProjectStyle=PackagesConfig "/p:RestoreRepositoryPath=$packages"
          if ($LASTEXITCODE -ne 0) { throw "WebView2 package restore failed with $LASTEXITCODE" }

      - name: Build native runtime Release x64
        shell: pwsh
        run: |
          msbuild 'desktop/CloudOS.NativeRuntime/CloudOS.NativeRuntime.vcxproj' /m /nologo /v:minimal /p:Configuration=Release /p:Platform=x64
          if ($LASTEXITCODE -ne 0) { throw "Native runtime build failed with $LASTEXITCODE" }

      - name: Build native shell Release x64
        shell: pwsh
        run: |
          msbuild 'desktop/CloudOS.NativeShell/CloudOS.NativeShell.vcxproj' /m /nologo /v:minimal /p:Configuration=Release /p:Platform=x64
          if ($LASTEXITCODE -ne 0) { throw "Native shell build failed with $LASTEXITCODE" }

      - name: Verify native binaries
        shell: pwsh
        run: |
          $out = 'desktop/CloudOS.NativeShell/bin/Release'
          foreach ($name in @('CloudOS.exe', 'CloudOS.NativeRuntime.dll')) {
            $path = Join-Path $out $name
            if (-not (Test-Path -LiteralPath $path)) { throw "Missing $path" }
            if ((Get-Item -LiteralPath $path).Length -le 0) { throw "Empty $path" }
          }

          $project = Get-Content -LiteralPath 'desktop/CloudOS.NativeShell/CloudOS.NativeShell.vcxproj' -Raw
          if ($project.Contains('<ClCompile Include="src\native_web_desktop_window.cpp"') -or
              $project.Contains('<ClCompile Include="src\native_webview_host.cpp"')) {
            throw 'Legacy web desktop returned to the compiled Shell V3 graph.'
          }
