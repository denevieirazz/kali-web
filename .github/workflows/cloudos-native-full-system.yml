name: CloudOS Native Full-System CI

on:
  push:
    branches:
      - 'rewrite/cloudos-native-full-system'
  pull_request:
    paths:
      - 'frontend/src/**'
      - 'desktop/CloudOS.NativeRuntime/**'
      - 'desktop/CloudOS.NativeShell/**'
      - 'scripts/native/**'
      - 'docs/native/**'
      - '.github/workflows/cloudos-native-full-system.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-foundation:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Confirm full CloudOS tree is preserved
        shell: pwsh
        run: |
          foreach ($path in @('frontend', 'backend', 'desktop/CloudOS.Host', 'desktop/CloudOS.NativeRuntime', 'desktop/CloudOS.NativeShell')) {
            if (-not (Test-Path -LiteralPath $path)) {
              throw "Required migration source/target path missing: $path"
            }
          }

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Cache pinned WebView2 SDK
        uses: actions/cache@v4
        with:
          path: desktop/CloudOS.NativeShell/packages/Microsoft.Web.WebView2.1.0.4078.44
          key: cloudos-webview2-1.0.4078.44-windows-v1

      - name: Validate and build through the developer entrypoint
        shell: cmd
        run: scripts\native\build-cloudos-native.cmd Release

      - name: Verify native release provenance and compiled graph
        shell: pwsh
        run: |
          ./scripts/native/verify-native-build-manifest.ps1 -Configuration Release -CheckSourceFingerprint

          $out = 'desktop/CloudOS.NativeShell/bin/Release'
          foreach ($name in @('CloudOS.exe', 'CloudOS.NativeRuntime.dll', 'cloudos-native-manifest.json', '.cloudos-build-fingerprint')) {
            $path = Join-Path $out $name
            if (-not (Test-Path -LiteralPath $path)) { throw "Missing $path" }
            if ((Get-Item -LiteralPath $path).Length -le 0) { throw "Empty $path" }
          }

          if (Test-Path -LiteralPath (Join-Path $out 'ui')) {
            throw 'Obsolete web desktop output returned to the native release.'
          }

          $project = Get-Content -LiteralPath 'desktop/CloudOS.NativeShell/CloudOS.NativeShell.vcxproj' -Raw
          if ($project.Contains('<ClCompile Include="src\native_web_desktop_window.cpp"') -or
              $project.Contains('<ClCompile Include="src\native_webview_host.cpp"')) {
            throw 'Legacy web desktop returned to the compiled native shell graph.'
          }

          $build = Get-Content -LiteralPath 'scripts/native/build-cloudos-native.cmd' -Raw
          foreach ($forbidden in @('node.exe', 'npm.cmd', 'frontend\dist', 'WEB_UI=')) {
            if ($build.Contains($forbidden)) {
              throw "Native developer build regressed to obsolete web desktop asset build: $forbidden"
            }
          }

      - name: Package portable CloudOS Native x64
        shell: pwsh
        run: |
          ./scripts/native/package-cloudos-native.ps1 -Configuration Release
          $zip = 'desktop/CloudOS.NativeShell/artifacts/CloudOS-Native-Release-x64.zip'
          if (-not (Test-Path -LiteralPath $zip)) { throw "Portable native package missing: $zip" }
          if ((Get-Item -LiteralPath $zip).Length -le 0) { throw "Portable native package is empty: $zip" }
          Write-Host "PACKAGE_SHA256=$((Get-FileHash -LiteralPath $zip -Algorithm SHA256).Hash.ToLowerInvariant())"

      - name: Publish verified CloudOS Native x64 artifact
        uses: actions/upload-artifact@v4
        with:
          name: CloudOS-Native-Release-x64-${{ github.sha }}
          if-no-files-found: error
          retention-days: 14
          path: |
            desktop/CloudOS.NativeShell/artifacts/CloudOS-Native-Release-x64.zip
            desktop/CloudOS.NativeShell/bin/Release/cloudos-native-manifest.json
            desktop/CloudOS.NativeShell/bin/Release/.cloudos-build-head
            desktop/CloudOS.NativeShell/bin/Release/.cloudos-build-fingerprint
