name: CloudOS Native Full-System CI

on:
  push:
    branches:
      - 'rewrite/cloudos-native-full-system'
  pull_request:
    paths:
      - 'frontend/src/**'
      - 'desktop/CloudOS.NativeCommon/**'
      - 'desktop/CloudOS.NativeRecovery/**'
      - 'desktop/CloudOS.NativeRuntime/**'
      - 'desktop/CloudOS.NativeShell/**'
      - 'scripts/native/**'
      - 'docs/native/**'
      - '.github/workflows/cloudos-native-full-system.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-foundation:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Confirm full CloudOS tree is preserved
        shell: pwsh
        run: |
          foreach ($path in @('frontend', 'backend', 'desktop/CloudOS.Host', 'desktop/CloudOS.NativeCommon', 'desktop/CloudOS.NativeRecovery', 'desktop/CloudOS.NativeRuntime', 'desktop/CloudOS.NativeShell')) {
            if (-not (Test-Path -LiteralPath $path)) {
              throw "Required migration source/target path missing: $path"
            }
          }

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Cache pinned WebView2 SDK
        uses: actions/cache@v4
        with:
          path: desktop/CloudOS.NativeShell/packages/Microsoft.Web.WebView2.1.0.4078.44
          key: cloudos-webview2-1.0.4078.44-windows-v1

      - name: Validate and build through the developer entrypoint
        shell: cmd
        run: scripts\native\build-cloudos-native.cmd Release

      - name: Smoke Stability/Readiness V9
        shell: pwsh
        run: |
          $artifactDir = 'desktop/CloudOS.NativeShell/artifacts'
          New-Item -ItemType Directory -Path $artifactDir -Force | Out-Null
          $report = Join-Path $artifactDir 'stability-v9-smoke.json'
          ./scripts/native/run-native-soak-v9.ps1 `
            -Launch `
            -DurationSeconds 20 `
            -StartupTimeoutSeconds 30 `
            -HeartbeatTimeoutSeconds 5 `
            -MaxWorkingSetGrowthMB 256 `
            -MaxPrivateGrowthMB 256 `
            -MaxHandleGrowth 512 `
            -MaxGdiGrowth 256 `
            -MaxUserGrowth 256 `
            -MaxThreadGrowth 64 `
            -OutputPath $report
          if (-not (Test-Path -LiteralPath $report)) { throw 'Stability V9 smoke report missing.' }
          $result = Get-Content -LiteralPath $report -Raw | ConvertFrom-Json
          if ($result.verdict -ne 'pass') { throw 'Stability V9 smoke verdict was not pass.' }

      - name: Smoke Lifecycle V10
        shell: pwsh
        run: |
          $artifactDir = 'desktop/CloudOS.NativeShell/artifacts'
          New-Item -ItemType Directory -Path $artifactDir -Force | Out-Null
          $report = Join-Path $artifactDir 'lifecycle-v10-smoke.json'
          ./scripts/native/run-native-lifecycle-smoke-v10.ps1 `
            -StartupTimeoutSeconds 30 `
            -TransitionTimeoutSeconds 8 `
            -OutputPath $report
          if (-not (Test-Path -LiteralPath $report)) { throw 'Lifecycle V10 smoke report missing.' }
          $result = Get-Content -LiteralPath $report -Raw | ConvertFrom-Json
          if ($result.verdict -ne 'pass') { throw 'Lifecycle V10 smoke verdict was not pass.' }
          if (@($result.events).Count -lt 6) { throw 'Lifecycle V10 did not exercise all expected transition checks.' }

      - name: Smoke Shell Supervisor V11
        shell: pwsh
        run: |
          $artifactDir = 'desktop/CloudOS.NativeShell/artifacts'
          New-Item -ItemType Directory -Path $artifactDir -Force | Out-Null
          $report = Join-Path $artifactDir 'supervisor-v11-smoke.json'
          ./scripts/native/run-native-supervisor-smoke-v11.ps1 -OutputPath $report
          if (-not (Test-Path -LiteralPath $report)) { throw 'Supervisor V11 smoke report missing.' }
          $result = Get-Content -LiteralPath $report -Raw | ConvertFrom-Json
          if ($result.verdict -ne 'pass') { throw 'Supervisor V11 smoke verdict was not pass.' }
          if ($result.evidence.ready_probe_exit_code -ne 0) { throw 'Supervisor V11 real readiness probe failed.' }
          if ($result.evidence.remaining_installation_shell_processes -ne 0) { throw 'Supervisor V11 leaked CloudOS processes.' }

      - name: Native surface regression tests V12
        shell: pwsh
        run: ./scripts/native/test-native-surfaces.ps1

      - name: Performance Visual V12 idle soak
        shell: pwsh
        run: |
          ./scripts/native/run-native-performance-smoke-v12.ps1 -DurationSeconds 120 -MaxAverageCpuPercent 2 -OutputPath 'desktop/CloudOS.NativeShell/artifacts/performance-v12-smoke.json'

      - name: Verify native release provenance and compiled graph
        shell: pwsh
        run: |
          ./scripts/native/verify-native-build-manifest.ps1 -Configuration Release -CheckSourceFingerprint

          $out = 'desktop/CloudOS.NativeShell/bin/Release'
          foreach ($name in @('CloudOS.exe', 'CloudOS.NativeRuntime.dll', 'CloudOS.Supervisor.exe', 'cloudos-native-manifest.json', '.cloudos-build-fingerprint')) {
            $path = Join-Path $out $name
            if (-not (Test-Path -LiteralPath $path)) { throw "Missing $path" }
            if ((Get-Item -LiteralPath $path).Length -le 0) { throw "Empty $path" }
          }

          if (Test-Path -LiteralPath (Join-Path $out 'ui')) {
            throw 'Obsolete web desktop output returned to the native release.'
          }

          $project = Get-Content -LiteralPath 'desktop/CloudOS.NativeShell/CloudOS.NativeShell.vcxproj' -Raw
          if ($project.Contains('<ClCompile Include="src\native_web_desktop_window.cpp"') -or
              $project.Contains('<ClCompile Include="src\native_webview_host.cpp"')) {
            throw 'Legacy web desktop returned to the compiled native shell graph.'
          }

          $supervisorProject = Get-Content -LiteralPath 'desktop/CloudOS.NativeRecovery/CloudOS.NativeRecovery.vcxproj' -Raw
          if (-not $supervisorProject.Contains('<TargetName>CloudOS.Supervisor</TargetName>')) {
            throw 'External Shell Supervisor V11 is not the compiled recovery target.'
          }

          $build = Get-Content -LiteralPath 'scripts/native/build-cloudos-native.cmd' -Raw
          foreach ($forbidden in @('node.exe', 'npm.cmd', 'frontend\dist', 'WEB_UI=')) {
            if ($build.Contains($forbidden)) {
              throw "Native developer build regressed to obsolete web desktop asset build: $forbidden"
            }
          }

      - name: Package portable CloudOS Native x64
        shell: pwsh
        run: |
          ./scripts/native/package-cloudos-native.ps1 -Configuration Release
          $zip = 'desktop/CloudOS.NativeShell/artifacts/CloudOS-Native-Release-x64.zip'
          if (-not (Test-Path -LiteralPath $zip)) { throw "Portable native package missing: $zip" }
          if ((Get-Item -LiteralPath $zip).Length -le 0) { throw "Portable native package is empty: $zip" }
          Write-Host "PACKAGE_SHA256=$((Get-FileHash -LiteralPath $zip -Algorithm SHA256).Hash.ToLowerInvariant())"

      - name: Publish verified CloudOS Native x64 artifact
        uses: actions/upload-artifact@v4
        with:
          name: CloudOS-Native-Release-x64-${{ github.sha }}
          if-no-files-found: error
          retention-days: 14
          path: |
            desktop/CloudOS.NativeShell/artifacts/CloudOS-Native-Release-x64.zip
            desktop/CloudOS.NativeShell/artifacts/stability-v9-smoke.json
            desktop/CloudOS.NativeShell/artifacts/lifecycle-v10-smoke.json
            desktop/CloudOS.NativeShell/artifacts/supervisor-v11-smoke.json
            desktop/CloudOS.NativeShell/artifacts/performance-v12-smoke.json
            desktop/CloudOS.NativeShell/bin/Release/cloudos-native-manifest.json
            desktop/CloudOS.NativeShell/bin/Release/.cloudos-build-head
            desktop/CloudOS.NativeShell/bin/Release/.cloudos-build-fingerprint
