name: Install two audited font fallback baselines once

on:
  push:
    branches:
      - stabilization/cloudos-foundation-batch-1

permissions:
  actions: read
  contents: write

jobs:
  install-two-audited-baselines:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact branch state
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download official Windows characterization artifact
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/9267159673/zip" \
            -o "$RUNNER_TEMP/audited-final-baselines.zip"
          mkdir -p "$RUNNER_TEMP/audited-final-baselines"
          unzip -q "$RUNNER_TEMP/audited-final-baselines.zip" -d "$RUNNER_TEMP/audited-final-baselines"

      - name: Verify provenance and install only two audited PNGs
        shell: python
        run: |
          import hashlib
          import json
          import os
          import shutil
          from pathlib import Path

          artifact = Path(os.environ['RUNNER_TEMP']) / 'audited-final-baselines'
          manifest = json.loads((artifact / 'manifest.json').read_text(encoding='utf-8-sig'))
          expected_head = '8f60536342ec9f3dcbe883cba42770825f0bef1e'
          expected_run = '31960512257'
          if manifest.get('head') != expected_head or str(manifest.get('runId')) != expected_run:
              raise SystemExit(f'Unexpected artifact provenance: {manifest!r}')

          replacements = {
              'desktop-after-oobe-actual.png': (
                  'aa045ca8b52d278a49eb08ac77c4b7d3a604a849a4467d8e1604329697788858',
                  Path('tests/playwright/__screenshots__/boot-oobe.spec.ts/desktop-after-oobe-chromium-windows.png'),
              ),
              'start-menu-all-actual.png': (
                  '9cbb76786a9aebfda9014d30c50f636f8538e33f5f4e7c1c9e7bb27c3e97fe59',
                  Path('tests/playwright/__screenshots__/start-menu.spec.ts/start-menu-all-chromium-windows.png'),
              ),
          }

          for filename, (expected_sha, destination) in replacements.items():
              matches = list(artifact.rglob(filename))
              if len(matches) != 1:
                  raise SystemExit(f'Expected exactly one {filename}, found {len(matches)}')
              source = matches[0]
              actual_sha = hashlib.sha256(source.read_bytes()).hexdigest()
              if actual_sha != expected_sha:
                  raise SystemExit(f'Hash mismatch for {filename}: {actual_sha}')
              destination.parent.mkdir(parents=True, exist_ok=True)
              shutil.copyfile(source, destination)
              print(f'Installed {filename} -> {destination} ({actual_sha})')

      - name: Commit only the two audited PNG baselines
        shell: bash
        run: |
          set -euo pipefail
          git add -- \
            tests/playwright/__screenshots__/boot-oobe.spec.ts/desktop-after-oobe-chromium-windows.png \
            tests/playwright/__screenshots__/start-menu.spec.ts/start-menu-all-chromium-windows.png
          if git diff --cached --quiet; then
            echo "Two audited baselines already installed; no commit required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "test(playwright): alinhar baselines finais ao fallback tipografico"
          git push origin HEAD:stabilization/cloudos-foundation-batch-1
