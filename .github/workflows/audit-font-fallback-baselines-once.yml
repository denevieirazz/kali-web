name: Install six audited font fallback baselines once

on:
  push:
    branches:
      - stabilization/cloudos-foundation-batch-1

permissions:
  actions: read
  contents: write

jobs:
  install-six-audited-baselines:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact branch state
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download official Windows characterization artifact
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/9267056891/zip" \
            -o "$RUNNER_TEMP/audited-font-fallback.zip"
          mkdir -p "$RUNNER_TEMP/audited-font-fallback"
          unzip -q "$RUNNER_TEMP/audited-font-fallback.zip" -d "$RUNNER_TEMP/audited-font-fallback"

      - name: Verify provenance and install only six audited PNGs
        shell: python
        run: |
          import hashlib
          import json
          import os
          import shutil
          from pathlib import Path

          artifact = Path(os.environ['RUNNER_TEMP']) / 'audited-font-fallback'
          manifest = json.loads((artifact / 'manifest.json').read_text(encoding='utf-8-sig'))
          expected_head = '3415a95937dccfb9485598b996f05b968999b950'
          expected_run = '31960114144'
          if manifest.get('head') != expected_head or str(manifest.get('runId')) != expected_run:
              raise SystemExit(f'Unexpected artifact provenance: {manifest!r}')

          replacements = {
              'oobe-welcome-actual.png': ('1a5cc519b97d4642e091edbffb5991249b64991374e9a57070c22f373de07265', Path('tests/playwright/__screenshots__/boot-oobe.spec.ts/oobe-welcome-chromium-windows.png')),
              'settings-personalization-actual.png': ('f020af076f5b9146af61c72c5272bff78d0efd0251c7c3caefb39ec0c3cf2f51', Path('tests/playwright/__screenshots__/settings-personalization.spec.ts/settings-personalization-chromium-windows.png')),
              'settings-taskbar-top-actual.png': ('d885293d01d592e995ad8bb6d7ad6a213a54fcfbd72bb23f01239d51f99df4e5', Path('tests/playwright/__screenshots__/settings-personalization.spec.ts/settings-taskbar-top-chromium-windows.png')),
              'desktop-custom-wallpaper-actual.png': ('bb49c5af6c3588410fa1bd75879b1159bae525078bc1277911b5b761b2121e0b', Path('tests/playwright/__screenshots__/settings-personalization.spec.ts/desktop-custom-wallpaper-chromium-windows.png')),
              'start-menu-home-actual.png': ('b3781c2559696fdf43fb14a4de38b304ed2fbc11e1a562f62ae652fb235684ec', Path('tests/playwright/__screenshots__/start-menu.spec.ts/start-menu-home-chromium-windows.png')),
              'start-running-calculator-actual.png': ('8cb50a28fb3f90d2c311e66c1093e7382f3639cf2c128349f475580e06c01212', Path('tests/playwright/__screenshots__/window-lifecycle.spec.ts/start-running-calculator-chromium-windows.png')),
          }

          for filename, (expected_sha, destination) in replacements.items():
              matches = list(artifact.rglob(filename))
              if len(matches) != 1:
                  raise SystemExit(f'Expected exactly one {filename}, found {len(matches)}')
              source = matches[0]
              actual_sha = hashlib.sha256(source.read_bytes()).hexdigest()
              if actual_sha != expected_sha:
                  raise SystemExit(f'Hash mismatch for {filename}: {actual_sha}')
              destination.parent.mkdir(parents=True, exist_ok=True)
              shutil.copyfile(source, destination)
              print(f'Installed {filename} -> {destination} ({actual_sha})')

      - name: Commit only the six audited PNG baselines
        shell: bash
        run: |
          set -euo pipefail
          git add -- \
            tests/playwright/__screenshots__/boot-oobe.spec.ts/oobe-welcome-chromium-windows.png \
            tests/playwright/__screenshots__/settings-personalization.spec.ts/settings-personalization-chromium-windows.png \
            tests/playwright/__screenshots__/settings-personalization.spec.ts/settings-taskbar-top-chromium-windows.png \
            tests/playwright/__screenshots__/settings-personalization.spec.ts/desktop-custom-wallpaper-chromium-windows.png \
            tests/playwright/__screenshots__/start-menu.spec.ts/start-menu-home-chromium-windows.png \
            tests/playwright/__screenshots__/window-lifecycle.spec.ts/start-running-calculator-chromium-windows.png
          if git diff --cached --quiet; then
            echo "Six audited baselines already installed; no commit required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "test(playwright): alinhar baselines ao fallback tipografico"
          git push origin HEAD:stabilization/cloudos-foundation-batch-1
