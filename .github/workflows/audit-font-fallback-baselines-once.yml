name: Audit deterministic font fallback baselines once

on:
  push:
    branches:
      - stabilization/cloudos-foundation-batch-1

permissions:
  actions: read
  contents: read

jobs:
  audit-font-fallback-baselines:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - name: Checkout exact branch state
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install chromium

      - name: Download audited characterization artifact
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $headers = @{
            Authorization = "Bearer $env:GH_TOKEN"
            Accept = 'application/vnd.github+json'
            'X-GitHub-Api-Version' = '2022-11-28'
          }
          $zip = Join-Path $env:RUNNER_TEMP 'font-fallback-source.zip'
          Invoke-WebRequest -Headers $headers -Uri "https://api.github.com/repos/$env:GITHUB_REPOSITORY/actions/artifacts/9266934129/zip" -OutFile $zip
          $dest = Join-Path $env:RUNNER_TEMP 'font-fallback-source'
          Expand-Archive -Path $zip -DestinationPath $dest -Force
          "FONT_FALLBACK_SOURCE=$dest" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Verify provenance and install six audited actuals
        shell: python
        run: |
          import hashlib
          import json
          import os
          import shutil
          from pathlib import Path

          source = Path(os.environ['FONT_FALLBACK_SOURCE'])
          manifest = json.loads((source / 'manifest.json').read_text(encoding='utf-8-sig'))
          if manifest.get('head') != '767b01a25567c1d7d05dba3d86825da7d62b6786' or str(manifest.get('runId')) != '31959642698':
              raise SystemExit(f'Unexpected artifact provenance: {manifest!r}')

          replacements = {
              'oobe-welcome-actual.png': (
                  '1a5cc519b97d4642e091edbffb5991249b64991374e9a57070c22f373de07265',
                  Path('tests/playwright/__screenshots__/boot-oobe.spec.ts/oobe-welcome-chromium-windows.png'),
              ),
              'settings-personalization-actual.png': (
                  '07ea287467f3a4cb0bbb5a9f62bc741e116e8afa446d8719c168239ded532acd',
                  Path('tests/playwright/__screenshots__/settings-personalization.spec.ts/settings-personalization-chromium-windows.png'),
              ),
              'settings-taskbar-top-actual.png': (
                  '4fca59562cb8707797ee10c9a816ef2a469b38092dc99cad08dd6bf09548bd2c',
                  Path('tests/playwright/__screenshots__/settings-personalization.spec.ts/settings-taskbar-top-chromium-windows.png'),
              ),
              'desktop-custom-wallpaper-actual.png': (
                  'bb49c5af6c3588410fa1bd75879b1159bae525078bc1277911b5b761b2121e0b',
                  Path('tests/playwright/__screenshots__/settings-personalization.spec.ts/desktop-custom-wallpaper-chromium-windows.png'),
              ),
              'start-menu-home-actual.png': (
                  '28defb4c8cb87cd886f333875131737475b524ac18809b82b86c7e1dd8f3ff4c',
                  Path('tests/playwright/__screenshots__/start-menu.spec.ts/start-menu-home-chromium-windows.png'),
              ),
              'start-running-calculator-actual.png': (
                  '8cb50a28fb3f90d2c311e66c1093e7382f3639cf2c128349f475580e06c01212',
                  Path('tests/playwright/__screenshots__/window-lifecycle.spec.ts/start-running-calculator-chromium-windows.png'),
              ),
          }

          for filename, (expected_sha, destination) in replacements.items():
              matches = list(source.rglob(filename))
              if len(matches) != 1:
                  raise SystemExit(f'Expected exactly one {filename}, found {len(matches)}')
              actual_sha = hashlib.sha256(matches[0].read_bytes()).hexdigest()
              if actual_sha != expected_sha:
                  raise SystemExit(f'Hash mismatch for {filename}: {actual_sha}')
              destination.parent.mkdir(parents=True, exist_ok=True)
              shutil.copyfile(matches[0], destination)
              print(f'Installed audited {filename} -> {destination} ({actual_sha})')

      - name: Generate hidden Start Menu all baseline only after audited home is installed
        shell: pwsh
        run: npx playwright test tests/playwright/start-menu.spec.ts --update-snapshots --output="$env:RUNNER_TEMP\start-menu-generation" --reporter=list

      - name: Require audited Start Menu home to remain byte-identical
        shell: python
        run: |
          import hashlib
          from pathlib import Path
          p = Path('tests/playwright/__screenshots__/start-menu.spec.ts/start-menu-home-chromium-windows.png')
          actual = hashlib.sha256(p.read_bytes()).hexdigest()
          expected = '28defb4c8cb87cd886f333875131737475b524ac18809b82b86c7e1dd8f3ff4c'
          if actual != expected:
              raise SystemExit(f'Start Menu home was not deterministic: {actual}')
          print(f'Start Menu home remained deterministic: {actual}')

      - name: Re-run full characterization normally with strict baselines
        shell: pwsh
        run: npx playwright test --grep-invert "Navegador CloudOS — WebView2 real|Navegador CloudOS — lifecycle Windows" --output="$env:RUNNER_TEMP\strict-characterization" --reporter=list

      - name: Require exactly the seven known PNG baselines to differ from repository
        shell: python
        run: |
          import hashlib
          import json
          import subprocess
          from pathlib import Path

          expected = sorted([
              'tests/playwright/__screenshots__/boot-oobe.spec.ts/oobe-welcome-chromium-windows.png',
              'tests/playwright/__screenshots__/settings-personalization.spec.ts/desktop-custom-wallpaper-chromium-windows.png',
              'tests/playwright/__screenshots__/settings-personalization.spec.ts/settings-personalization-chromium-windows.png',
              'tests/playwright/__screenshots__/settings-personalization.spec.ts/settings-taskbar-top-chromium-windows.png',
              'tests/playwright/__screenshots__/start-menu.spec.ts/start-menu-all-chromium-windows.png',
              'tests/playwright/__screenshots__/start-menu.spec.ts/start-menu-home-chromium-windows.png',
              'tests/playwright/__screenshots__/window-lifecycle.spec.ts/start-running-calculator-chromium-windows.png',
          ])
          changed = sorted(x.replace('\\', '/') for x in subprocess.check_output(['git', 'diff', '--name-only'], text=True).splitlines() if x.strip())
          if changed != expected:
              raise SystemExit(f'Unexpected changed files. expected={expected!r} actual={changed!r}')
          out = Path('baseline-audit-output')
          out.mkdir(exist_ok=True)
          hashes = {}
          for rel in expected:
              hashes[rel] = hashlib.sha256(Path(rel).read_bytes()).hexdigest()
          (out / 'hashes.json').write_text(json.dumps(hashes, indent=2, sort_keys=True) + '\n', encoding='utf-8')
          (out / 'provenance.json').write_text(json.dumps({
              'sourceArtifactId': '9266934129',
              'sourceRunId': '31959642698',
              'sourceHead': '767b01a25567c1d7d05dba3d86825da7d62b6786',
              'generatorRunId': __import__('os').environ.get('GITHUB_RUN_ID'),
              'generatorHead': __import__('os').environ.get('GITHUB_SHA'),
              'strictCharacterizationPassed': True,
          }, indent=2, sort_keys=True) + '\n', encoding='utf-8')
          print(json.dumps(hashes, indent=2, sort_keys=True))

      - name: Upload audited candidate baselines without committing
        uses: actions/upload-artifact@v4
        with:
          name: cloudos-font-fallback-baseline-audit-${{ github.run_id }}
          path: |
            tests/playwright/__screenshots__
            baseline-audit-output
          if-no-files-found: error
          retention-days: 14
