name: CloudOS Hardening Gate Observer

on:
  pull_request:
    branches:
      - stabilization/cloudos-workflow-batch-4
  workflow_dispatch:

permissions:
  contents: read

env:
  EXPECTED_SHA: af65c366af20d3a1beedfcd2b1ff3d8685faa3d8

jobs:
  linux-final-head:
    name: Linux final-head gate
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: af65c366af20d3a1beedfcd2b1ff3d8685faa3d8
          fetch-depth: 0
      - name: Assert exact HEAD
        shell: bash
        run: |
          actual="$(git rev-parse HEAD)"
          echo "HARDENING_HEAD=$actual"
          test "$actual" = "$EXPECTED_SHA"
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
      - name: Scope gate
        run: node scripts/workflow/test-batch4-stabilization-scope.mjs
      - name: Install dependencies
        run: npm ci
      - name: Frontend
        run: npm run test:frontend
      - name: Backend
        run: npm test
      - name: E2E
        run: npm run test:e2e
      - name: Lint
        run: npm run lint
      - name: TypeScript
        run: npm --prefix frontend run lint
      - name: Production build
        run: npm run build

  windows-final-head:
    name: Windows final-head gate
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: af65c366af20d3a1beedfcd2b1ff3d8685faa3d8
          fetch-depth: 0
      - name: Assert exact HEAD
        shell: pwsh
        run: |
          $actual = (git rev-parse HEAD).Trim()
          Write-Host "HARDENING_HEAD=$actual"
          if ($actual -ne $env:EXPECTED_SHA) { throw "HEAD divergente: $actual" }
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
      - name: Scope gate
        run: node scripts/workflow/test-batch4-stabilization-scope.mjs
      - name: Install dependencies
        run: npm ci
      - name: Frontend
        run: npm run test:frontend
      - name: Backend
        run: npm test
      - name: E2E
        run: npm run test:e2e
      - name: Lint
        run: npm run lint
      - name: TypeScript
        run: npm --prefix frontend run lint
      - name: Production build
        run: npm run build

  drone-final-head:
    name: Drone final-head gate
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: af65c366af20d3a1beedfcd2b1ff3d8685faa3d8
          fetch-depth: 0
      - name: Assert exact HEAD
        shell: bash
        run: |
          actual="$(git rev-parse HEAD)"
          echo "HARDENING_HEAD=$actual"
          test "$actual" = "$EXPECTED_SHA"
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
      - name: Scope gate
        run: node scripts/workflow/test-batch4-stabilization-scope.mjs
      - name: Install dependencies
        run: npm ci
      - name: Production build prerequisite
        run: npm run build
      - name: Install Chromium
        run: npx playwright install chromium
      - name: Execute Drone and resilience
        id: drone
        continue-on-error: true
        shell: bash
        run: |
          mkdir -p test-results/drone
          export GITHUB_SHA="$EXPECTED_SHA"
          npx playwright test --config=playwright.drone.config.ts 2>&1 | tee test-results/drone/playwright.log
          exit ${PIPESTATUS[0]}
      - name: Render Drone report
        if: always()
        shell: bash
        run: |
          export GITHUB_SHA="$EXPECTED_SHA"
          node scripts/workflow/render-drone-report.mjs
      - name: Verify findings.json exists
        if: always()
        shell: bash
        run: |
          test -f test-results/drone/findings.json
          echo "FINDINGS_JSON=present bytes=$(wc -c < test-results/drone/findings.json)"
          test -f test-results/drone/regressions.json
      - name: Upload Drone evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hardening-drone-final-head
          retention-days: 14
          if-no-files-found: error
          path: |
            DRONE_REPORT.md
            test-results/drone/**
            test-results/playwright-drone/**
            playwright-drone-report/**
      - name: Fail-closed Drone gate
        if: always()
        shell: bash
        run: |
          export GITHUB_SHA="$EXPECTED_SHA"
          node scripts/workflow/render-drone-report.mjs --gate
          test "${{ steps.drone.outcome }}" = "success"

  human-final-head:
    name: Long Session and Stress final-head
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: af65c366af20d3a1beedfcd2b1ff3d8685faa3d8
          fetch-depth: 0
      - name: Assert exact HEAD
        shell: bash
        run: |
          actual="$(git rev-parse HEAD)"
          echo "HARDENING_HEAD=$actual"
          test "$actual" = "$EXPECTED_SHA"
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
      - name: Scope gate
        run: node scripts/workflow/test-batch4-stabilization-scope.mjs
      - name: Install dependencies
        run: npm ci
      - name: Production build prerequisite
        run: npm run build
      - name: Install Chromium
        run: npx playwright install chromium
      - name: Long Session and Stress
        shell: bash
        run: |
          mkdir -p test-results/human-simulation
          npx playwright test --config=playwright.human.config.ts 2>&1 | tee test-results/human-simulation/playwright.log
          exit ${PIPESTATUS[0]}
      - name: Upload human evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hardening-human-final-head
          retention-days: 14
          if-no-files-found: warn
          path: |
            HUMAN_SIMULATION_REPORT.md
            test-results/human-simulation/**
            test-results/playwright-human/**
            playwright-human-report/**