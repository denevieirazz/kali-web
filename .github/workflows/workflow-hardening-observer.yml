name: CloudOS Hardening Gate Observer

on:
  pull_request:
    branches:
      - stabilization/cloudos-workflow-batch-4
  workflow_dispatch:

permissions:
  contents: read

env:
  EXPECTED_SHA: 6d1cabb5c02d6adea8f7a6bd1d65a4543d6ac14d

jobs:
  files-targeted:
    name: Files rename-reference behavior
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 6d1cabb5c02d6adea8f7a6bd1d65a4543d6ac14d
          fetch-depth: 0
      - name: Assert exact HEAD
        shell: bash
        run: |
          actual="$(git rev-parse HEAD)"
          echo "HARDENING_HEAD=$actual"
          test "$actual" = "$EXPECTED_SHA"
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
      - name: Scope gate
        run: node scripts/workflow/test-batch4-stabilization-scope.mjs
      - name: Install dependencies
        run: npm ci
      - name: Production build prerequisite
        run: npm run build
      - name: Install Chromium
        run: npx playwright install chromium
      - name: Mission 3 FILES only
        shell: bash
        run: |
          mkdir -p test-results/human-simulation
          npx playwright test --config=playwright.human.config.ts -g "3 FILES" 2>&1 | tee test-results/human-simulation/playwright-files.log
          exit ${PIPESTATUS[0]}
      - name: Upload FILES evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: files-rename-reference-targeted
          retention-days: 7
          if-no-files-found: warn
          path: |
            test-results/human-simulation/**
            test-results/playwright-human/**
            playwright-human-report/**