name: CloudOS Workflow Batch 4 Stabilization CI

on:
  push:
    branches:
      - stabilization/cloudos-workflow-batch-4
  pull_request:
    branches:
      - stabilization/cloudos-workflow-batch-4
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cloudos-workflow-batch4-stabilization-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux-stabilization:
    if: github.event_name != 'pull_request'
    name: Linux stabilization regression
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout stabilization
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
      - name: Verify stabilization scope
        run: node scripts/workflow/test-batch4-stabilization-scope.mjs
      - name: Install dependencies
        run: npm ci
      - name: Frontend tests
        run: npm run test:frontend
      - name: Backend regression
        run: npm test
      - name: E2E regression
        run: npm run test:e2e
      - name: Lint
        run: npm run lint
      - name: Production build
        run: npm run build

  windows-stabilization:
    if: github.event_name != 'pull_request'
    name: Windows stabilization regression
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout stabilization
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
      - name: Verify stabilization scope
        run: node scripts/workflow/test-batch4-stabilization-scope.mjs
      - name: Install dependencies
        run: npm ci
      - name: Frontend tests
        run: npm run test:frontend
      - name: Backend regression
        run: npm test
      - name: E2E regression
        run: npm run test:e2e
      - name: Lint
        run: npm run lint
      - name: Production build
        run: npm run build

  human-user-simulation:
    name: Human user simulation v2
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout stabilization
        uses: actions/checkout@v4
        with:
          ref: stabilization/cloudos-workflow-batch-4
          fetch-depth: 0
      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
      - name: Verify stabilization scope
        run: node scripts/workflow/test-batch4-stabilization-scope.mjs
      - name: Prepare isolated human missions
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const file = 'tests/playwright/workflow-human-simulation-v2.spec.ts';
          let source = fs.readFileSync(file, 'utf8');
          if (source.includes("test.describe.serial('Workflow Human User Simulation v2'")) {
            source = source.replace("test.describe.serial('Workflow Human User Simulation v2'", "test.describe('Workflow Human User Simulation v2'");
          } else if (!source.includes("test.describe('Workflow Human User Simulation v2'")) {
            throw new Error('Bloco describe esperado da simulação v2 não foi encontrado.');
          }
          fs.writeFileSync(file, source, 'utf8');
          NODE
      - name: Install dependencies
        run: npm ci
      - name: Build CloudOS frontend
        run: npm run build
      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium
      - name: Execute human user simulation v2
        id: human_simulation
        shell: bash
        run: |
          mkdir -p test-results/human-simulation
          export GITHUB_SHA="$(git rev-parse HEAD)"
          set +e
          npx playwright test --config=playwright.human.config.ts 2>&1 | tee test-results/human-simulation/playwright.log
          status=${PIPESTATUS[0]}
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          exit "$status"
      - name: Ensure report exists
        if: always()
        shell: bash
        run: |
          if [ ! -f HUMAN_SIMULATION_REPORT.md ]; then
            tested_sha="$(git rev-parse HEAD)"
            {
              echo '# HUMAN_SIMULATION_REPORT.md'
              echo
              echo '## Human simulation v2 não chegou ao relatório interno'
              echo
              echo "**Commit executado:** \`${tested_sha}\`"
              echo
              echo '**FALHOU**'
              echo
              echo 'O runner iniciou a suíte real, mas ela terminou antes de o agregador produzir o relatório. O log bruto do Playwright foi preservado no artifact.'
              echo
              echo '```text'
              tail -n 250 test-results/human-simulation/playwright.log 2>/dev/null || true
              echo '```'
            } > HUMAN_SIMULATION_REPORT.md
          fi
      - name: Upload human simulation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: workflow-human-simulation-v2-${{ github.sha }}
          if-no-files-found: warn
          retention-days: 14
          path: |
            HUMAN_SIMULATION_REPORT.md
            test-results/human-simulation/**
            test-results/playwright-human/**
            playwright-human-report/**
      - name: Publish v2 harness and report
        if: always()
        shell: bash
        run: |
          git config user.name "cloudos-human-simulation"
          git config user.email "actions@users.noreply.github.com"
          git add HUMAN_SIMULATION_REPORT.md tests/playwright/workflow-human-simulation-v2.spec.ts
          if git diff --cached --quiet; then
            echo 'Human simulation v2/report unchanged.'
            exit 0
          fi
          git commit -m "test(report): registrar simulacao humana v2 [skip ci]"
          git push origin HEAD:stabilization/cloudos-workflow-batch-4
