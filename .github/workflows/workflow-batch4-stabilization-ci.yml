name: CloudOS Workflow Batch 4 Stabilization CI

on:
  push:
    branches:
      - stabilization/cloudos-workflow-batch-4
  pull_request:
    branches:
      - stabilization/cloudos-workflow-batch-4
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudos-workflow-batch4-stabilization-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux-stabilization:
    if: github.event_name != 'pull_request'
    name: Linux stabilization regression
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout stabilization
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.2

      - name: Verify checked out SHA integrity
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          TELEMETRY_OUTPUT_DIR: test-results/linux
        run: node scripts/workflow/record-sha-telemetry.mjs --gate

      - name: Unit test SHA telemetry gate
        run: |
          node scripts/workflow/test-record-sha-telemetry.mjs
          node scripts/workflow/test-workflow-sha-contract.mjs
      - name: Verify stabilization scope
        run: node scripts/workflow/test-batch4-stabilization-scope.mjs
      - name: Install dependencies
        run: npm ci
      - name: Frontend tests
        run: npm run test:frontend
      - name: Backend regression
        run: npm test
      - name: E2E regression
        run: npm run test:e2e
      - name: Lint
        run: npm run lint
      - name: Production build
        run: npm run build
      - name: Upload Linux telemetry
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: workflow-linux-telemetry-${{ github.event.pull_request.head.sha || github.sha }}
          if-no-files-found: warn
          retention-days: 14
          path: test-results/linux/**

  windows-stabilization:
    if: github.event_name != 'pull_request'
    name: Windows stabilization regression
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout stabilization
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.2

      - name: Verify checked out SHA integrity
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          TELEMETRY_OUTPUT_DIR: test-results/windows
        run: node scripts/workflow/record-sha-telemetry.mjs --gate
      - name: Verify stabilization scope
        run: node scripts/workflow/test-batch4-stabilization-scope.mjs
      - name: Install dependencies
        run: npm ci
      - name: Frontend tests
        run: npm run test:frontend
      - name: Backend regression
        run: npm test
      - name: E2E regression
        run: npm run test:e2e
      - name: Lint
        run: npm run lint
      - name: Production build
        run: npm run build
      - name: Upload Windows telemetry
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: workflow-windows-telemetry-${{ github.event.pull_request.head.sha || github.sha }}
          if-no-files-found: warn
          retention-days: 14
          path: test-results/windows/**

  human-user-simulation:
    name: Human user simulation v2
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout stabilization
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.2

      - name: Verify checked out SHA integrity
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          TELEMETRY_OUTPUT_DIR: test-results/human-simulation
        run: node scripts/workflow/record-sha-telemetry.mjs --gate
      - name: Verify stabilization scope
        run: node scripts/workflow/test-batch4-stabilization-scope.mjs
      - name: Prepare isolated human missions
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const file = 'tests/playwright/workflow-human-simulation-v2.spec.ts';
          let source = fs.readFileSync(file, 'utf8');
          if (source.includes("test.describe.serial('Workflow Human User Simulation v2'")) {
            source = source.replace("test.describe.serial('Workflow Human User Simulation v2'", "test.describe('Workflow Human User Simulation v2'");
          } else if (!source.includes("test.describe('Workflow Human User Simulation v2'")) {
            throw new Error('Bloco describe esperado da simulação v2 não foi encontrado.');
          }
          const hardenedEnsureFiles = `async function ensureFiles(page: import('@playwright/test').Page) {
            let files = page.locator('.cf-root').last();
            const filesWindow = page.locator('.window:has(.cf-root)').last();
            if (await files.isVisible().catch(() => false) && await filesWindow.evaluate(element => element.classList.contains('active')).catch(() => false)) {
              return files;
            }
            const workspace = await ensureWorkspace(page);
            const workspaceWindow = page.locator('.window:has(.workflow-workspace)').last();
            if (!await workspaceWindow.evaluate(element => element.classList.contains('active')).catch(() => false)) {
              await page.keyboard.press('Control+Alt+1');
              await expect(workspaceWindow).toHaveClass(/active/, { timeout: 10_000 });
            }
            await workspace.locator('.ww-quick-actions').getByRole('button', { name: 'Files', exact: true }).click();
            files = page.locator('.cf-root').last();
            await expect(files).toBeVisible({ timeout: 15_000 });
            await expect(page.locator('.window:has(.cf-root)').last()).toHaveClass(/active/, { timeout: 10_000 });
            return files;
          }`;
          const pattern = /async function ensureFiles\(page: import\('@playwright\/test'\)\.Page\) \{[\s\S]*?\n\}\n\nasync function createFile/;
          if (!pattern.test(source)) throw new Error('Helper ensureFiles esperado não foi encontrado.');
          source = source.replace(pattern, `${hardenedEnsureFiles}\n\nasync function createFile`);
          fs.writeFileSync(file, source, 'utf8');
          NODE
      - name: Install dependencies
        run: npm ci
      - name: Build CloudOS frontend
        run: npm run build
      - name: Install Chromium for Playwright
        run: npx playwright install chromium
      - name: Execute human user simulation v2
        id: human_simulation
        shell: bash
        run: |
          mkdir -p test-results/human-simulation
          export GITHUB_SHA="$(git rev-parse HEAD)"
          set +e
          npx playwright test --config=playwright.human.config.ts 2>&1 | tee test-results/human-simulation/playwright.log
          status=${PIPESTATUS[0]}
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          exit "$status"
      - name: Normalize human simulation report
        if: always()
        shell: bash
        run: |
          generated_report="test-results/human-simulation/HUMAN_SIMULATION_REPORT.md"
          if [ -f "$generated_report" ]; then
            cp "$generated_report" HUMAN_SIMULATION_REPORT.md
          else
            tested_sha="$(git rev-parse HEAD)"
            {
              echo '# HUMAN_SIMULATION_REPORT.md'
              echo
              echo '## Human simulation v2 não chegou ao relatório interno'
              echo
              echo "**Commit executado:** \`${tested_sha}\`"
              echo
              echo '**FALHOU**'
              echo
              echo 'O runner iniciou a suíte real, mas ela terminou antes de o agregador produzir o relatório. O log bruto do Playwright foi preservado no artifact.'
              echo
              echo '```text'
              tail -n 250 test-results/human-simulation/playwright.log 2>/dev/null || true
              echo '```'
            } > HUMAN_SIMULATION_REPORT.md
          fi
      - name: Upload human simulation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: workflow-human-simulation-v2-${{ github.event.pull_request.head.sha || github.sha }}
          if-no-files-found: warn
          retention-days: 14
          path: |
            HUMAN_SIMULATION_REPORT.md
            test-results/human-simulation/**
            test-results/playwright-human/**
            playwright-human-report/**
      - name: Publish report to job summary
        if: always()
        shell: bash
        run: cat HUMAN_SIMULATION_REPORT.md >> "$GITHUB_STEP_SUMMARY"
