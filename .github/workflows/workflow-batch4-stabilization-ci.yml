name: CloudOS Workflow Batch 4 Stabilization CI

on:
  push:
    branches:
      - stabilization/cloudos-workflow-batch-4
  pull_request:
    branches:
      - stabilization/cloudos-workflow-batch-4
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cloudos-workflow-batch4-stabilization-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux-stabilization:
    if: github.event_name != 'pull_request'
    name: Linux stabilization regression
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout stabilization
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
      - name: Verify stabilization scope
        run: node scripts/workflow/test-batch4-stabilization-scope.mjs
      - name: Install dependencies
        run: npm ci
      - name: Frontend tests
        run: npm run test:frontend
      - name: Backend regression
        run: npm test
      - name: E2E regression
        run: npm run test:e2e
      - name: Lint
        run: npm run lint
      - name: Production build
        run: npm run build

  windows-stabilization:
    if: github.event_name != 'pull_request'
    name: Windows stabilization regression
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout stabilization
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
      - name: Verify stabilization scope
        run: node scripts/workflow/test-batch4-stabilization-scope.mjs
      - name: Install dependencies
        run: npm ci
      - name: Frontend tests
        run: npm run test:frontend
      - name: Backend regression
        run: npm test
      - name: E2E regression
        run: npm run test:e2e
      - name: Lint
        run: npm run lint
      - name: Production build
        run: npm run build

  human-user-simulation:
    name: Human user simulation
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout stabilization
        uses: actions/checkout@v4
        with:
          ref: stabilization/cloudos-workflow-batch-4
          fetch-depth: 0
      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
      - name: Verify stabilization scope
        run: node scripts/workflow/test-batch4-stabilization-scope.mjs
      - name: Stabilize human simulation harness
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const file = 'tests/playwright/workflow-human-simulation.spec.ts';
          let source = fs.readFileSync(file, 'utf8');

          const oldLocator = "await modal.getByLabel('Nome').fill(name);\n  await modal.getByLabel('Cliente').fill(`Cliente ${name}`);\n  await modal.getByLabel('Descrição').fill(`Criado pelo simulador humano: ${name}`);";
          const newLocator = "await modal.getByRole('textbox', { name: 'Nome', exact: true }).fill(name);\n  await modal.getByRole('textbox', { name: 'Cliente', exact: true }).fill(`Cliente ${name}`);\n  await modal.getByRole('textbox', { name: 'Descrição', exact: true }).fill(`Criado pelo simulador humano: ${name}`);";
          if (source.includes(oldLocator)) source = source.replace(oldLocator, newLocator);
          else if (!source.includes(newLocator)) throw new Error('Locator esperado do formulário Workspace não foi encontrado.');

          const oldSha = "process.env.GITHUB_SHA || 'execução local'";
          const newSha = "process.env.CLOUDOS_TESTED_SHA || process.env.GITHUB_SHA || 'execução local'";
          if (source.includes(oldSha)) source = source.replace(oldSha, newSha);
          else if (!source.includes(newSha)) throw new Error('Campo de SHA esperado no relatório não foi encontrado.');

          fs.writeFileSync(file, source, 'utf8');
          NODE
      - name: Install dependencies
        run: npm ci
      - name: Build CloudOS frontend
        run: npm run build
      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium
      - name: Execute human user simulation
        id: human_simulation
        shell: bash
        run: |
          mkdir -p test-results/human-simulation
          export CLOUDOS_TESTED_SHA="$(git rev-parse HEAD)"
          set +e
          npx playwright test --config=playwright.human.config.ts 2>&1 | tee test-results/human-simulation/playwright.log
          status=${PIPESTATUS[0]}
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          exit "$status"
      - name: Ensure report exists
        if: always()
        shell: bash
        run: |
          if [ ! -f HUMAN_SIMULATION_REPORT.md ]; then
            tested_sha="$(git rev-parse HEAD)"
            {
              echo '# HUMAN_SIMULATION_REPORT.md'
              echo
              echo '## Human simulation não chegou ao relatório interno'
              echo
              echo "**Commit executado:** \`${tested_sha}\`"
              echo
              echo '**FALHOU**'
              echo
              echo 'O runner iniciou a suíte real, mas ela terminou antes de o gerador de missões produzir o relatório. O log bruto do Playwright foi preservado no artifact.'
              echo
              echo '```text'
              tail -n 250 test-results/human-simulation/playwright.log 2>/dev/null || true
              echo '```'
            } > HUMAN_SIMULATION_REPORT.md
          fi
      - name: Upload human simulation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: workflow-human-simulation-${{ github.sha }}
          if-no-files-found: warn
          retention-days: 14
          path: |
            HUMAN_SIMULATION_REPORT.md
            test-results/human-simulation/**
            test-results/playwright-human/**
            playwright-human-report/**
      - name: Publish harness and human simulation report
        if: always()
        shell: bash
        run: |
          git config user.name "cloudos-human-simulation"
          git config user.email "actions@users.noreply.github.com"
          git add HUMAN_SIMULATION_REPORT.md tests/playwright/workflow-human-simulation.spec.ts
          if git diff --cached --quiet; then
            echo 'Human simulation harness/report unchanged.'
            exit 0
          fi
          git commit -m "test(report): registrar simulacao humana real [skip ci]"
          git push origin HEAD:stabilization/cloudos-workflow-batch-4
