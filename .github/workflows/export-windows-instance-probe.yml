name: Validate Windows External Instance Probe

on:
  push:
    branches:
      - integration/cloudos-unified-runtime
    paths:
      - .github/workflows/export-windows-instance-probe.yml

permissions:
  contents: write

jobs:
  probe:
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: integration/cloudos-unified-runtime
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x

      - name: Export probe and widen bounded startup timeout
        shell: pwsh
        run: |
          $path = 'backend/src/apps/windowsExternalInstanceGuard.js'
          $text = Get-Content -LiteralPath $path -Raw

          $oldExport = 'async function probeProcessesByExecutableName(executable) {'
          $newExport = 'export async function probeProcessesByExecutableName(executable) {'
          $exportCount = ([regex]::Matches($text, [regex]::Escape($oldExport))).Count
          if ($exportCount -ne 1) { throw "PROBE_EXPORT_PATTERN_COUNT=$exportCount" }
          $text = $text.Replace($oldExport, $newExport)

          $oldTimeout = 'timeout: 4_000,'
          $newTimeout = 'timeout: 12_000,'
          $timeoutCount = ([regex]::Matches($text, [regex]::Escape($oldTimeout))).Count
          if ($timeoutCount -ne 1) { throw "PROBE_TIMEOUT_PATTERN_COUNT=$timeoutCount" }
          $text = $text.Replace($oldTimeout, $newTimeout)

          Set-Content -LiteralPath $path -Value $text -Encoding utf8 -NoNewline

      - name: Run guard and real Windows probe contracts
        shell: pwsh
        run: node --test backend/test/windows-external-instance-guard.test.js backend/test/windows-external-instance-probe.test.js

      - name: Verify only guard source changed
        shell: pwsh
        run: |
          $changed = @(git status --porcelain | ForEach-Object { $_.Substring(3) })
          if ($changed.Count -ne 1 -or $changed[0] -ne 'backend/src/apps/windowsExternalInstanceGuard.js') {
            throw "UNEXPECTED_FILES=$($changed -join ',')"
          }

      - name: Commit probe hardening
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- backend/src/apps/windowsExternalInstanceGuard.js
          git commit -m "fix(runtime): tolerate Windows instance probe startup"
          git push origin HEAD:integration/cloudos-unified-runtime
