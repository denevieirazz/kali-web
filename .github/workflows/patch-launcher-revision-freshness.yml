name: Patch Launcher Revision Freshness

on:
  push:
    branches:
      - integration/cloudos-unified-runtime
    paths:
      - .github/workflows/patch-launcher-revision-freshness.yml
      - scripts/tmp-patch-launcher-revision-freshness.ps1

permissions:
  contents: write

jobs:
  patch:
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: integration/cloudos-unified-runtime
          fetch-depth: 0

      - name: Apply bounded launcher patch
        shell: pwsh
        run: ./scripts/tmp-patch-launcher-revision-freshness.ps1

      - name: Run freshness contracts
        shell: pwsh
        run: |
          ./scripts/test-cloudos-session-freshness.ps1
          ./scripts/test-native-host-freshness.ps1
          $tokens = $null
          $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path 'scripts/launch/start-cloudos.ps1'), [ref]$tokens, [ref]$errors)
          if ($errors.Count -gt 0) { throw "LAUNCHER_PARSE_ERRORS=$($errors.Count)" }

      - name: Verify bounded diff
        shell: pwsh
        run: |
          $changed = @(git status --porcelain | ForEach-Object { $_.Substring(3) })
          if ($changed.Count -ne 1) { throw "UNEXPECTED_CHANGED_FILE_COUNT=$($changed.Count)" }
          if ($changed[0] -ne 'scripts/launch/start-cloudos.ps1') { throw "UNEXPECTED_FILE=$($changed[0])" }

      - name: Commit launcher fix
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- scripts/launch/start-cloudos.ps1
          git commit -m "fix(launcher): restart stale running revision"
          git push origin HEAD:integration/cloudos-unified-runtime
