name: Apply Primary HWND Handoff

on:
  push:
    branches:
      - integration/cloudos-unified-runtime
    paths:
      - scripts/native/apply-primary-hwnd-handoff.ps1
      - .github/workflows/apply-primary-hwnd-handoff.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: integration/cloudos-unified-runtime

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Apply bounded HWND handoff
        shell: pwsh
        run: ./scripts/native/apply-primary-hwnd-handoff.ps1

      - name: Check patch whitespace
        shell: pwsh
        run: git diff --check

      - name: Build CloudOS Host
        shell: pwsh
        run: dotnet build desktop/CloudOS.Host/CloudOS.Host.csproj -c Release --nologo

      - name: Run Host contracts
        shell: pwsh
        run: dotnet run --project desktop/CloudOS.Host.Tests/CloudOS.Host.Tests.csproj -c Release

      - name: Commit validated handoff
        shell: pwsh
        run: |
          if (-not (git status --porcelain)) {
            Write-Host 'PRIMARY_HWND_HANDOFF_NO_CHANGES'
            exit 0
          }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add desktop/CloudOS.Host/Bridge/WebMessageBridge.cs
          git commit -m 'fix: hand off replaced primary HWND within contained job'
          git push origin HEAD:integration/cloudos-unified-runtime
