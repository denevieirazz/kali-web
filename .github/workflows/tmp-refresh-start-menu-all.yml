name: TEMP Refresh Start Menu All Baseline

on:
  pull_request:

permissions:
  contents: write

jobs:
  refresh:
    if: github.head_ref == 'poc/cloudos-linux-runtime-xpra'
    runs-on: windows-2022
    timeout-minutes: 20

    steps:
      - name: Checkout branch head
        uses: actions/checkout@v4
        with:
          ref: poc/cloudos-linux-runtime-xpra
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install chromium

      - name: Build frontend
        run: npm.cmd run build

      - name: Refresh only Start Menu All baseline
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $approved = 'tests/playwright/__screenshots__/start-menu.spec.ts/start-menu-all-chromium-windows.png'
          $home = 'tests/playwright/__screenshots__/start-menu.spec.ts/start-menu-home-chromium-windows.png'
          $homeBefore = (Get-FileHash -Algorithm SHA256 $home).Hash

          npx playwright test tests/playwright/start-menu.spec.ts --update-snapshots --reporter=list
          if ($LASTEXITCODE -ne 0) { throw 'Start Menu semantic validation failed; refusing snapshot update.' }

          $homeAfter = (Get-FileHash -Algorithm SHA256 $home).Hash
          if ($homeAfter -ne $homeBefore) { throw 'Start Menu Home baseline changed unexpectedly.' }

          $changed = @(git diff --name-only -- tests/playwright/__screenshots__ | ForEach-Object { $_.Trim() } | Where-Object { $_ })
          if ($changed.Count -ne 1 -or $changed[0] -ne $approved) {
            throw "Unexpected screenshot changes: $($changed -join ', ')"
          }

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- $approved
          git commit -m 'test(playwright): refresh start menu all visual baseline'
          git push origin HEAD:poc/cloudos-linux-runtime-xpra
