name: Enhance Windows Runtime Physical Proof

on:
  push:
    branches:
      - integration/cloudos-unified-runtime
    paths:
      - .github/workflows/enhance-windows-physical-proof.yml
      - scripts/tmp-enhance-windows-physical-proof.py

permissions:
  contents: write

jobs:
  enhance:
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: integration/cloudos-unified-runtime
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x

      - name: Apply harness expansion
        shell: pwsh
        run: |
          $generator = 'scripts/tmp-enhance-windows-physical-proof.py'
          $text = Get-Content -LiteralPath $generator -Raw
          $text = $text.Replace('$Stage:', '${Stage}:')
          $text = $text.Replace('$ReopenStressCycles:', '${ReopenStressCycles}:')
          Set-Content -LiteralPath $generator -Value $text -Encoding utf8 -NoNewline
          python $generator
          git checkout -- $generator

      - name: Run physical proof contract tests
        shell: pwsh
        run: node --test backend/test/windows-physical-proof-contract.test.js

      - name: Parse PowerShell harness
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path 'scripts/run-windows-contained-runtime-physical-proof.ps1'),
            [ref]$tokens,
            [ref]$errors)
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_.Message }
            throw "PHYSICAL_PROOF_PARSE_ERRORS=$($errors.Count)"
          }

      - name: Verify bounded diff
        shell: pwsh
        run: |
          $changed = @(git status --porcelain | ForEach-Object { $_.Substring(3) })
          $expected = @(
            'backend/test/windows-physical-proof-contract.test.js',
            'scripts/run-windows-contained-runtime-physical-proof.ps1'
          )
          if ($changed.Count -ne $expected.Count) { throw "UNEXPECTED_CHANGED_FILE_COUNT=$($changed.Count)" }
          foreach ($path in $expected) {
            if ($changed -notcontains $path) { throw "EXPECTED_FILE_NOT_CHANGED=$path" }
          }

      - name: Commit expanded proof harness
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- backend/test/windows-physical-proof-contract.test.js scripts/run-windows-contained-runtime-physical-proof.ps1
          git commit -m "test(runtime): expand Windows physical lifecycle proof"
          git push origin HEAD:integration/cloudos-unified-runtime
