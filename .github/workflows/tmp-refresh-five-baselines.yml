name: TEMP Refresh Five Reviewed Visual Baselines

on:
  pull_request:

permissions:
  contents: write

jobs:
  refresh:
    if: github.head_ref == 'poc/cloudos-linux-runtime-xpra'
    runs-on: windows-2022
    timeout-minutes: 20

    steps:
      - name: Checkout branch head
        uses: actions/checkout@v4
        with:
          ref: poc/cloudos-linux-runtime-xpra
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install chromium

      - name: Build frontend
        run: npm.cmd run build

      - name: Refresh only the five reviewed baselines
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $approved = @(
            'tests/playwright/__screenshots__/settings-personalization.spec.ts/settings-personalization-chromium-windows.png',
            'tests/playwright/__screenshots__/settings-personalization.spec.ts/settings-taskbar-top-chromium-windows.png',
            'tests/playwright/__screenshots__/settings-personalization.spec.ts/desktop-custom-wallpaper-chromium-windows.png',
            'tests/playwright/__screenshots__/start-menu.spec.ts/start-menu-home-chromium-windows.png',
            'tests/playwright/__screenshots__/window-lifecycle.spec.ts/start-running-calculator-chromium-windows.png'
          )
          $deferred = 'tests/playwright/__screenshots__/start-menu.spec.ts/start-menu-all-chromium-windows.png'

          npx playwright test tests/playwright/settings-personalization.spec.ts tests/playwright/start-menu.spec.ts tests/playwright/window-lifecycle.spec.ts --update-snapshots --reporter=list
          if ($LASTEXITCODE -ne 0) { throw "Playwright semantic validation failed; refusing snapshot update." }

          git checkout -- $deferred

          $changed = @(git diff --name-only -- tests/playwright/__screenshots__ | ForEach-Object { $_.Trim() } | Where-Object { $_ })
          $unexpected = @($changed | Where-Object { $_ -notin $approved })
          if ($unexpected.Count -gt 0) {
            throw "Unexpected screenshot changes: $($unexpected -join ', ')"
          }

          foreach ($file in $approved) {
            if ($file -notin $changed) {
              throw "Approved baseline did not change as expected: $file"
            }
          }

          Write-Host 'Reviewed snapshot changes:'
          $changed | ForEach-Object { Write-Host " - $_" }

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- $approved
          git commit -m 'test(playwright): refresh five reviewed visual baselines'
          git push origin HEAD:poc/cloudos-linux-runtime-xpra
